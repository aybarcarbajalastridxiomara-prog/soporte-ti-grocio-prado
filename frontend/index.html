<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soporte TI | Grocio Prado — DEMO</title><style>
:root{--navy:#172640;--red:#bf3648;--bg:#f4f6fa;--border:#e1e7f0;--muted:#67768a;--green:#166b52}*{box-sizing:border-box}body{margin:0;font:14px/1.5 'Segoe UI',Arial,sans-serif;color:#243149;background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:var(--navy);padding:24px 14px;color:white}.brand{display:flex;gap:12px;align-items:center;padding:8px 10px 23px;border-bottom:1px solid #ffffff22}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--red);font-size:22px;font-weight:900}.brand strong{font-size:18px}.brand small{display:block;color:#b8c5d9;font-size:11px}.navcaption{font-size:10px;color:#a8b7cd;letter-spacing:1.5px;margin:28px 12px 8px}.nav{display:block;width:100%;border:0;background:transparent;color:#d7e1ee;text-align:left;padding:13px 14px;border-radius:10px;margin:3px 0}.nav.active,.nav:hover{background:#ffffff20;color:#fff}.footer{margin-top:35px;padding:20px 12px;border-top:1px solid #ffffff22;font-size:12px;color:#c5d0df}.footer button{margin-top:10px;background:transparent;border:1px solid #7385a1;color:white;border-radius:9px;padding:9px 12px;width:100%}header{background:white;border-bottom:1px solid var(--border);height:77px;display:flex;align-items:center;justify-content:space-between;padding:0 30px}header small{display:block;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:1px}header strong{font-size:19px}.avatar{border-radius:11px;background:#eaeef5;padding:10px 12px;font-weight:800}.content{padding:30px;max-width:1450px;margin:auto}.headerline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:21px}.headerline h1{font-size:27px;margin:0}.headerline p{margin:3px 0;color:var(--muted)}.btn{border:1px solid var(--border);background:#fff;color:#26334b;border-radius:9px;padding:10px 14px;font-weight:700;display:inline-block}.btn:hover{filter:brightness(.97)}.btn.red{background:var(--red);border-color:var(--red);color:white}.btn.navy{background:var(--navy);border-color:var(--navy);color:white}.btn.sm{padding:6px 10px;font-size:12px}.demo{background:#fff8e9;border:1px solid #eee0be;border-radius:10px;color:#806020;padding:12px 15px;margin-bottom:21px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--border);border-radius:14px;box-shadow:0 9px 26px #1c2b430a}.stat{padding:19px 21px}.stat small{color:var(--muted);font-weight:650}.stat strong{display:block;font-size:34px;margin:3px 0}.stat span{font-size:11px;color:#8795a5}.panel{margin-bottom:20px;overflow:hidden}.paneltop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:19px 21px;border-bottom:1px solid var(--border)}.paneltop h2{font-size:16px;margin:0}.paneltop p{margin:2px 0;color:var(--muted);font-size:12px}.panelbody{padding:20px}.cols{display:grid;grid-template-columns:1.45fr .85fr;gap:17px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}th{text-align:left;color:var(--muted);background:#fafbfd;font-size:11px;letter-spacing:.3px}th,td{padding:13px 15px;border-bottom:1px solid #eef1f6}td{font-size:12px}tbody tr:last-child td{border-bottom:0}.muted{color:var(--muted);font-size:12px}.chip{display:inline-block;border-radius:100px;padding:4px 9px;font-size:11px;font-weight:750;white-space:nowrap}.chip.pending{color:#945f13;background:#fff0d9}.chip.progress{color:#2763a0;background:#e9f1ff}.chip.closed{color:#17684e;background:#e7f6ef}.chip.observed{color:#a92e43;background:#fae9ec}.bars{padding:20px}.bars div{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.bars .track{height:9px;background:#eef1f6;border-radius:20px;margin:7px 0 17px;display:block}.track i{display:block;height:9px;background:var(--red);border-radius:20px}label{display:block;font-size:12px;font-weight:750;color:#49566b;margin:0 0 6px}input,select,textarea{background:#fff;border:1px solid #d5deea;border-radius:9px;padding:11px 12px;outline:none;width:100%;color:#26334b}textarea{min-height:105px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#407bb9}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.filter{display:flex;gap:9px}.filter input{min-width:120px}.filter select{width:180px}.overlay{position:fixed;inset:0;background:#0d1930b5;display:none;justify-content:flex-end;z-index:10}.overlay.open{display:flex}.drawer{background:white;padding:27px;width:min(570px,100%);height:100%;overflow-y:auto}.drawerhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:19px}.drawerhead h2{font-size:21px;margin:4px 0}.close{border:0;border-radius:9px;background:#f0f2f6;width:34px;height:34px;font-size:21px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.detailgrid div{border:1px solid var(--border);background:#fafbfe;padding:11px;border-radius:8px}.detailgrid strong{display:block;font-size:12px;margin-top:3px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.timeline{border-left:3px solid #dae2ee;padding-left:12px;margin:13px 0;font-size:12px}.timeline small{display:block;color:var(--muted)}.login{min-height:100vh;background:linear-gradient(135deg,#15253e,#304967);display:grid;place-items:center;padding:20px}.loginbox{width:min(530px,100%);background:white;border-radius:17px;padding:31px;box-shadow:0 25px 65px #0003}.loginbox h1{font-size:25px;margin:19px 0 4px}.loginbox p{color:var(--muted);margin:0 0 20px}.role{width:100%;background:white;border:1px solid var(--border);padding:13px 15px;border-radius:9px;display:flex;justify-content:space-between;align-items:center;text-align:left;margin-bottom:9px}.role:hover{border-color:var(--red);background:#fffafb}.role small{display:block;color:var(--muted);font-size:11px}.role b{font-size:13px}.message{position:fixed;right:20px;bottom:20px;padding:13px 18px;color:white;background:var(--navy);border-radius:10px;z-index:15;display:none;max-width:340px}.message.show{display:block}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:710px){.layout{display:block}aside{padding:10px;position:relative}.brand{padding:5px 8px 12px}.navcaption,.footer{display:none}.navgroup{display:flex;overflow-x:auto;gap:5px}.nav{white-space:nowrap;width:auto;font-size:12px}header{height:66px;padding:0 17px}header strong{font-size:15px}header .username{display:none}.content{padding:19px 13px}.headerline{align-items:flex-start;flex-direction:column}.headerline h1{font-size:23px}.stat{padding:13px}.stat strong{font-size:26px}.grid2{grid-template-columns:1fr}.full{grid-column:auto}.paneltop{align-items:flex-start;flex-direction:column}.filter{width:100%;flex-wrap:wrap}.filter select{width:auto}.drawer{padding:19px}}
</style></head><body><div id="app"></div><div class="overlay" id="overlay"><div class="drawer" id="drawer"></div></div><div class="message" id="message"></div><script>
(()=>{'use strict';const key='grocio-support-demo-2026';const users=[{id:'j',name:'Jefe de Sistemas',role:'JEFE',area:'Sistemas',initials:'JS'},{id:'a',name:'Asistente de Sistemas',role:'ASISTENTE',area:'Sistemas',initials:'AS'},{id:'p',name:'Practicante de Sistemas',role:'PRACTICANTE',area:'Sistemas',initials:'PS'},{id:'t',name:'Representante de Tesorería',role:'REPRESENTANTE',area:'Tesorería',initials:'RT'},{id:'c',name:'Representante de Contabilidad',role:'REPRESENTANTE',area:'Contabilidad',initials:'RC'}];const seed=[{id:15,code:'INC-2026-000015',subject:'Impresora no responde',area:'Tesorería',category:'Hardware',desc:'La impresora del área no imprime los documentos.',priority:'Alta',state:'Cerrado',date:'02/11/2026',tech:'a',final:true,solution:'Se reinstaló el controlador y se comprobaron las impresiones.',evaluation:'Observación',comment:'El problema volvió a presentarse tras imprimir varios documentos.',history:[['Registrada por el área','02/11/2026'],['Atendida y cerrada por Soporte TI','03/11/2026'],['Observación del representante','04/11/2026']]},{id:16,code:'INC-2026-000016',subject:'Intermitencia de internet',area:'Contabilidad',category:'Redes',desc:'Se pierde conexión al sistema contable.',priority:'Alta',state:'En revisión',date:'04/11/2026',tech:'p',final:false,history:[['Registrada por el área','04/11/2026'],['Practicante inició atención','05/11/2026']]},{id:17,code:'INC-2026-000017',subject:'Equipo no enciende',area:'Tesorería',category:'Hardware',desc:'La computadora no enciende al presionar el botón.',priority:'Media',state:'Pendiente',date:'05/11/2026',tech:null,final:false,history:[['Registrada por el área','05/11/2026']]},{id:18,code:'INC-2026-000018',subject:'Error en hoja de cálculo',area:'Contabilidad',category:'Software',desc:'El archivo presenta errores al abrir.',priority:'Baja',state:'Cerrado',date:'31/10/2026',tech:'a',final:true,solution:'Archivo restaurado y verificado.',evaluation:'Conformidad',comment:'Problema resuelto.',history:[['Registrada por el área','31/10/2026'],['Solución y cierre registrados','01/11/2026'],['Conformidad del representante','02/11/2026']]},{id:19,code:'INC-2026-000019',subject:'Actualización de antivirus',area:'Tesorería',category:'Software',desc:'Se requiere actualizar las definiciones de seguridad.',priority:'Media',state:'En revisión',date:'06/11/2026',tech:'a',final:false,history:[['Registrada por el área','06/11/2026'],['Asignada por jefatura','06/11/2026']]},{id:20,code:'INC-2026-000020',subject:'Escáner no detectado',area:'Contabilidad',category:'Hardware',desc:'La estación de trabajo no reconoce el escáner.',priority:'Media',state:'Pendiente',date:'07/11/2026',tech:null,final:false,history:[['Registrada por el área','07/11/2026']]}];let tickets;try{tickets=JSON.parse(localStorage.getItem(key))||JSON.parse(JSON.stringify(seed))}catch(_){tickets=JSON.parse(JSON.stringify(seed))}let current=null,page='dashboard',query='',filter='';const app=document.getElementById('app'),overlay=document.getElementById('overlay'),drawer=document.getElementById('drawer');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(tickets));const role=r=>({JEFE:'Jefatura',ASISTENTE:'Asistente',PRACTICANTE:'Practicante',REPRESENTANTE:'Representante'}[r]||r);const tech=id=>users.find(u=>u.id===id)?.name||'Sin asignar';const visible=t=>current.role!=='REPRESENTANTE'||current.area===t.area;const list=()=>tickets.filter(visible);function notify(s){let m=document.getElementById('message');m.textContent=s;m.classList.add('show');clearTimeout(window.msgtimer);window.msgtimer=setTimeout(()=>m.classList.remove('show'),3300)}function log(t,msg){t.history.push([msg,new Date().toLocaleDateString('es-PE')])}function pill(s){return '<span class="chip '+({Pendiente:'pending','En revisión':'progress',Cerrado:'closed',Observación:'observed',Conformidad:'closed'}[s]||'progress')+'">'+esc(s)+'</span>'}function header(t,d,a=''){return '<div class="headerline"><div><h1>'+t+'</h1><p>'+d+'</p></div>'+a+'</div>'}const warning='<div class="demo"><b>DEMOSTRACIÓN ACADÉMICA.</b> Usuarios y datos ficticios. La información se guarda únicamente en este navegador; aún no existe conexión a Supabase ni autenticación real.</div>';function login(){app.innerHTML='<div class="login"><div class="loginbox"><div class="logo">TI</div><h1>Sistema de Gestión de Incidencias</h1><p>Municipalidad Distrital de Grocio Prado · Proyecto académico 2026</p>'+warning+'<h3>Selecciona un perfil para la demostración</h3>'+users.map(u=>'<button class="role" data-login="'+u.id+'"><span><b>'+esc(u.name)+'</b><small>'+role(u.role)+' · '+esc(u.area)+'</small></span><b>→</b></button>').join('')+'<p style="font-size:11px;margin-top:16px">Metodologías Ágiles · Universidad Privada San Juan Bautista</p></div></div>'}function navItems(){let a=[['dashboard','▦','Panel principal'],['tickets','▤','Incidencias']];if(current.role==='REPRESENTANTE')a.push(['new','＋','Registrar incidencia']);if(current.role==='JEFE')a.push(['observations','⚑','Observaciones']);if(current.role!=='REPRESENTANTE')a.push(['reports','▧','Informes']);return a}function shell(){app.innerHTML='<div class="layout"><aside><div class="brand"><div class="logo">TI</div><div><strong>Soporte TI</strong><small>Grocio Prado · 2026</small></div></div><div class="navcaption">MENÚ PRINCIPAL</div><div class="navgroup">'+navItems().map(a=>'<button class="nav '+(page===a[0]?'active':'')+'" data-view="'+a[0]+'">'+a[1]+' &nbsp; '+a[2]+'</button>').join('')+'</div><div class="footer"><b>'+esc(current.name)+'</b><div>'+role(current.role)+' · '+esc(current.area)+'</div><button data-logout="1">Cambiar de perfil ↺</button></div></aside><div><header><div><small>Municipalidad Distrital de Grocio Prado</small><strong>Gestión y seguimiento de incidencias</strong></div><div class="avatar">'+current.initials+'</div></header><div class="content" id="content"></div></div></div>'}function stat(label,n,hint){return '<div class="stat"><small>'+label+'</small><strong>'+n+'</strong><span>'+hint+'</span></div>'}function table(data){if(!data.length)return '<div class="panelbody muted">No existen incidencias para estos criterios.</div>';return '<div class="scroll"><table><thead><tr><th>CÓDIGO</th><th>INCIDENCIA</th><th>ÁREA</th><th>PRIORIDAD</th><th>ESTADO</th><th></th></tr></thead><tbody>'+data.map(t=>'<tr><td><b>'+esc(t.code)+'</b><div class="muted">'+esc(t.date)+'</div></td><td><b>'+esc(t.subject)+'</b><div class="muted">'+esc(t.category)+'</div></td><td>'+esc(t.area)+'</td><td>'+esc(t.priority)+'</td><td>'+pill(t.state)+(t.evaluation==='Observación'?' '+pill('Observación'):'')+'</td><td><button class="btn sm" data-id="'+t.id+'">Ver detalle</button></td></tr>').join('')+'</tbody></table></div>'}function dashboard(){let a=list(),p=a.filter(t=>t.state==='Pendiente').length,r=a.filter(t=>t.state==='En revisión').length,c=a.filter(t=>t.state==='Cerrado').length,o=a.filter(t=>t.evaluation==='Observación').length;return header('Panel principal','Estado general de las incidencias municipales.',current.role==='REPRESENTANTE'?'<button class="btn red" data-view="new">＋ Nueva incidencia</button>':'<button class="btn navy" data-view="tickets">Ver incidencias</button>')+warning+'<div class="stats">'+stat('Total de incidencias',a.length,'Registros del entorno demo')+stat('Pendientes',p,'Esperan asignación')+stat('En revisión',r,'Atención en proceso')+stat('Cerradas',c,'Atenciones finalizadas')+'</div><div class="cols"><div class="panel"><div class="paneltop"><div><h2>Incidencias recientes</h2><p>Actividad de las áreas municipales</p></div><button class="btn sm" data-view="tickets">Ver todas</button></div>'+table([...a].reverse().slice(0,5))+'</div><div class="panel"><div class="paneltop"><div><h2>Indicadores de atención</h2><p>Estado de los reportes</p></div></div><div class="bars">'+[['Pendientes',p],['En revisión',r],['Cerradas',c],['Observadas',o]].map(z=>'<div><span>'+z[0]+'</span><b>'+z[1]+'</b></div><span class="track"><i style="width:'+(a.length?Math.round(z[1]*100/a.length):0)+'%"></i></span>').join('')+'<p class="muted">Las métricas cambian mientras se utiliza la demo.</p></div></div></div>'}function ticketsPage(){let a=list().filter(t=>(!filter||t.state===filter)&&(!query||(t.code+' '+t.subject+' '+t.area+' '+t.desc).toLowerCase().includes(query.toLowerCase())));return header('Gestión de incidencias','Registro, consulta y atención de solicitudes.',current.role==='REPRESENTANTE'?'<button class="btn red" data-view="new">＋ Registrar incidencia</button>':'')+warning+'<div class="panel"><div class="paneltop"><div><h2>Listado de incidencias</h2><p>'+a.length+' resultados</p></div><div class="filter"><input id="search" placeholder="Buscar por código, asunto o área..." value="'+esc(query)+'"><select id="filter"><option value="">Todos los estados</option>'+['Pendiente','En revisión','Cerrado'].map(v=>'<option '+(filter===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div></div>'+table(a)+'</div>'}function newPage(){if(current.role!=='REPRESENTANTE')return dashboard();return header('Registrar incidencia','Ingresa una solicitud de soporte tecnológico para tu área.')+warning+'<div class="panel"><div class="paneltop"><div><h2>Nueva incidencia</h2><p>Completa la información necesaria para el registro</p></div></div><div class="panelbody"><form id="create" class="grid2"><div><label>Área solicitante</label><input disabled value="'+esc(current.area)+'"></div><div><label>Prioridad *</label><select name="priority"><option>Media</option><option>Alta</option><option>Baja</option></select></div><div class="full"><label>Asunto *</label><input name="subject" required minlength="5" maxlength="200" placeholder="Ej. Falla de impresora"></div><div><label>Categoría *</label><select name="category"><option>Hardware</option><option>Software</option><option>Redes</option><option>Sistemas</option><option>Otros</option></select></div><div><label>Impacto</label><select name="impact"><option>Parcialmente</option><option>Sí</option><option>No</option></select></div><div class="full"><label>Descripción del problema *</label><textarea name="desc" required minlength="12" placeholder="Describe qué ocurre... "></textarea></div><div class="full"><button class="btn red">Registrar incidencia</button> <button type="button" class="btn" data-view="tickets">Cancelar</button></div></form></div></div>'}function observations(){if(current.role!=='JEFE')return dashboard();let a=tickets.filter(t=>t.evaluation==='Observación'&&t.state==='Cerrado');return header('Seguimiento de observaciones','Incidencias que recibieron observaciones después del cierre.')+warning+'<div class="stats">'+stat('Observaciones registradas',a.length,'Casos para seguimiento')+stat('Áreas observadas',new Set(a.map(t=>t.area)).size,'Áreas municipales')+stat('Conformidades',tickets.filter(t=>t.evaluation==='Conformidad').length,'Atenciones aceptadas')+stat('Cierres',tickets.filter(t=>t.state==='Cerrado').length,'Atenciones finalizadas')+'</div><div class="panel"><div class="paneltop"><h2>Incidencias observadas</h2></div>'+table(a)+'</div>'}function reports(){if(current.role==='REPRESENTANTE')return dashboard();return header('Informes y reportes','Consulta indicadores y descarga datos para una revisión.', '<button class="btn red" data-export="1">↓ Exportar CSV</button>')+warning+'<div class="stats">'+stat('Tickets totales',tickets.length,'Registro acumulado')+stat('Atendidos',tickets.filter(t=>t.state==='Cerrado').length,'Incidencias cerradas')+stat('Observados',tickets.filter(t=>t.evaluation==='Observación').length,'Seguimiento técnico')+stat('En revisión',tickets.filter(t=>t.state==='En revisión').length,'Trabajos en curso')+'</div><div class="panel"><div class="paneltop"><div><h2>Borradores técnicos</h2><p>Abre una incidencia asignada para generar el borrador.</p></div></div>'+table(tickets.filter(t=>t.tech))+'</div>'}function render(){if(!current){login();return}shell();document.getElementById('content').innerHTML=({dashboard,tickets:ticketsPage,new:newPage,observations,reports}[page]||dashboard)()}function modal(html){drawer.innerHTML=html;overlay.classList.add('open')}function close(){overlay.classList.remove('open');drawer.innerHTML=''}function detail(id){let t=tickets.find(t=>t.id===id);if(!t||!visible(t))return;let controls=[];if(current.role==='JEFE'&&t.state!=='Cerrado')controls.push('<button class="btn red" data-action="assign" data-id="'+id+'">'+(t.tech?'Reasignar técnico':'Asignar técnico')+'</button>');if(['ASISTENTE','PRACTICANTE'].includes(current.role)&&t.state!=='Cerrado'){if(!t.tech)controls.push('<button class="btn red" data-action="take" data-id="'+id+'">Tomar incidencia</button>');if(t.tech===current.id){controls.push('<button class="btn red" data-action="attend" data-id="'+id+'">Registrar atención</button>');if(t.final)controls.push('<button class="btn navy" data-action="close" data-id="'+id+'">Cerrar incidencia</button>')}}if(current.role==='REPRESENTANTE'&&t.state==='Cerrado'&&!t.evaluation)controls.push('<button class="btn red" data-action="evaluate" data-id="'+id+'">Conformidad u observación</button>');if(current.role!=='REPRESENTANTE'&&t.tech)controls.push('<button class="btn" data-action="report" data-id="'+id+'">↓ Borrador técnico</button>');modal('<div class="drawerhead"><div><div class="muted">'+esc(t.code)+' · '+esc(t.area)+'</div><h2>'+esc(t.subject)+'</h2>'+pill(t.state)+'</div><button class="close" data-close="1">×</button></div><p>'+esc(t.desc)+'</p><div class="detailgrid"><div><span class="muted">Prioridad</span><strong>'+esc(t.priority)+'</strong></div><div><span class="muted">Categoría</span><strong>'+esc(t.category)+'</strong></div><div><span class="muted">Técnico</span><strong>'+esc(tech(t.tech))+'</strong></div><div><span class="muted">Registrada</span><strong>'+esc(t.date)+'</strong></div></div>'+(t.solution?'<p><b>Solución:</b> '+esc(t.solution)+'</p>':'')+(t.evaluation?'<p><b>Evaluación:</b> '+pill(t.evaluation)+'<br><span class="muted">'+esc(t.comment)+'</span></p>':'')+'<div class="actions">'+controls.join('')+'</div><hr><h3>Historial</h3>'+(t.history||[]).slice().reverse().map(h=>'<div class="timeline"><b>'+esc(h[0])+'</b><small>'+esc(h[1])+'</small></div>').join(''))}function actionForm(op,id){let t=tickets.find(t=>t.id===id);if(!t)return;let html={assign:'<label>Técnico responsable</label><select name="tech"><option value="a">Asistente de Sistemas</option><option value="p">Practicante de Sistemas</option></select>',attend:'<label>Diagnóstico</label><textarea name="diag" required minlength="8"></textarea><label>Acciones realizadas</label><textarea name="steps" required minlength="8"></textarea><label>Solución aplicada</label><textarea name="solution"></textarea><label><input type="checkbox" style="width:auto" name="final"> Marcar solución final</label>',close:'<p>Solo puedes cerrar incidencias con solución final registrada.</p><label>Resumen del cierre</label><textarea name="summary" minlength="20" required></textarea>',evaluate:'<label>Evaluación</label><select name="result"><option>Conformidad</option><option>Observación</option></select><label>Comentario / sustento</label><textarea name="comment" minlength="8" required></textarea>'}[op];modal('<div class="drawerhead"><div><small>'+esc(t.code)+'</small><h2>'+({assign:'Asignación técnica',attend:'Atención técnica',close:'Cierre de incidencia',evaluate:'Evaluación del área'}[op])+'</h2></div><button class="close" data-close="1">×</button></div><form id="operate" data-id="'+id+'" data-op="'+op+'">'+html+'<div class="actions"><button class="btn red">Guardar</button><button class="btn" data-close="1" type="button">Cancelar</button></div></form>')}function download(name,content,type='text/plain;charset=utf-8'){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function report(t){download('informe-demo-'+t.code+'.txt',['BORRADOR DE INFORME TÉCNICO - DEMO ACADÉMICA','Municipalidad Distrital de Grocio Prado','Código: '+t.code,'Área: '+t.area,'Asunto: '+t.subject,'Estado: '+t.state,'Técnico: '+tech(t.tech),'Descripción: '+t.desc,'Solución: '+(t.solution||'Pendiente'),'Evaluación: '+(t.evaluation||'Sin evaluar'),'Este documento no constituye un informe institucional oficial.'].join('\n'))}function exportCsv(){let data=[['Código','Área','Asunto','Prioridad','Estado','Técnico']].concat(tickets.map(t=>[t.code,t.area,t.subject,t.priority,t.state,tech(t.tech)]));download('incidencias-demo.csv','\ufeff'+data.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.login){current=users.find(u=>u.id===b.dataset.login);page='dashboard';render();return}if(b.dataset.logout){current=null;page='dashboard';close();render();return}if(b.dataset.view){page=b.dataset.view;render();return}if(b.dataset.id&&!b.dataset.action){detail(Number(b.dataset.id));return}if(b.dataset.close){close();return}if(b.dataset.export){exportCsv();return}if(b.dataset.action){let t=tickets.find(t=>t.id===Number(b.dataset.id));if(!t)return;if(b.dataset.action==='report'){report(t);notify('Borrador de demostración descargado.');return}if(b.dataset.action==='take'){if(!['ASISTENTE','PRACTICANTE'].includes(current.role)||t.tech||t.state==='Cerrado')return;t.tech=current.id;t.state='En revisión';log(t,'Incidencia tomada por '+current.name);save();detail(t);notify('Incidencia tomada.');return}actionForm(b.dataset.action,t.id)}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let n=e.target.selectionStart;render();let x=document.getElementById('search');x.focus();x.setSelectionRange(n,n)}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}});document.addEventListener('submit',e=>{if(e.target.id==='create'){e.preventDefault();if(current.role!=='REPRESENTANTE')return;let f=new FormData(e.target),id=Math.max(20,...tickets.map(t=>t.id))+1,t={id,code:'INC-2026-'+String(id).padStart(6,'0'),subject:String(f.get('subject')).trim(),desc:String(f.get('desc')).trim(),area:current.area,category:f.get('category'),priority:f.get('priority'),state:'Pendiente',date:new Date().toLocaleDateString('es-PE'),tech:null,final:false,history:[]};if(t.subject.length<5||t.desc.length<12)return;log(t,'Incidencia registrada');tickets.unshift(t);save();page='tickets';render();notify('Incidencia '+t.code+' registrada en demo.');return}if(e.target.id==='operate'){e.preventDefault();let form=e.target,f=new FormData(form),op=form.dataset.op,t=tickets.find(t=>t.id===Number(form.dataset.id));if(!t)return;if(op==='assign'){if(current.role!=='JEFE'||t.state==='Cerrado')return;t.tech=f.get('tech');t.state='En revisión';t.final=false;log(t,'Asignación de jefatura: '+tech(t.tech))}if(op==='attend'){if(t.tech!==current.id||t.state==='Cerrado')return;let d=String(f.get('diag')).trim(),a=String(f.get('steps')).trim(),sol=String(f.get('solution')).trim();if(d.length<8||a.length<8)return;if(f.has('final')&&!sol){notify('Una solución final necesita detalle.');return}t.final=f.has('final');if(sol)t.solution=sol;log(t,'Atención: '+d+'; acciones: '+a)}if(op==='close'){if(t.tech!==current.id||t.state==='Cerrado'||!t.final)return;let s=String(f.get('summary')).trim();if(s.length<20)return;t.state='Cerrado';log(t,'Cierre técnico: '+s)}if(op==='evaluate'){if(current.role!=='REPRESENTANTE'||t.area!==current.area||t.state!=='Cerrado'||t.evaluation)return;let v=f.get('result'),comment=String(f.get('comment')).trim();if(comment.length<8)return;t.evaluation=v;t.comment=comment;log(t,'Evaluación: '+v+'. '+comment)}save();close();render();notify('Acción guardada en la demo.')}});overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();})();
</script></body></html>
