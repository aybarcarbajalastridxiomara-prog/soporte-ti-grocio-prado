name: Probar proteccion de rutas V3 ante reapertura V4

on:
  push:
    branches:
      - ajustes-docente-v4
    paths:
      - "backend/app/v4_guardia.py"
      - "backend/app/main.py"
      - "backend/app/routes/asignaciones.py"
      - "backend/app/routes/intervenciones.py"
      - "backend/app/routes/incidencias.py"
      - "backend/app/routes/verificaciones.py"
      - "backend/app/routes/v4_verificaciones.py"
      - "backend/app/routes/v4_asignaciones.py"
      - "backend/app/routes/v4_intervenciones.py"
      - "backend/app/routes/v4_cierres.py"
      - "backend/app/v4_esquema.py"
      - "database/03_reapertura_v4.sql"
      - ".github/workflows/probar-proteccion-v3-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proteger-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "httpx>=0.28,<1"

      - name: Paso 109D9E - Probar proteccion V3 y continuidad V4
        shell: bash
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          contenedor="grocio-proteccion-v3-v4-ci"
          docker run -d --rm \
            --name "$contenedor" \
            -p 127.0.0.1::5432 \
            -e POSTGRES_DB=grocio_ci \
            -e POSTGRES_PASSWORD=clave_ci_temporal \
            -v "$GITHUB_WORKSPACE/database:/sql:ro" \
            postgres:16 >/dev/null
          trap 'docker rm -f "$contenedor" >/dev/null 2>&1 || true' EXIT

          listo=0
          for intento in {1..45}; do
            if docker exec -e PGPASSWORD=clave_ci_temporal "$contenedor" \
              psql -X -h 127.0.0.1 -U postgres -d grocio_ci \
              -Atq -c 'SELECT 1' >/dev/null 2>&1; then
              listo=1
              break
            fi
            sleep 1
          done
          test "$listo" -eq 1 || {
            echo 'ERROR: PostgreSQL temporal no inicializo grocio_ci'
            exit 1
          }

          docker exec -i "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id UUID PRIMARY KEY);
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE soporte_ti_api LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT
            PASSWORD 'api_ci_temporal';
          SQL

          docker exec "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/01_esquema_mvp.sql
          docker exec "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/02_permisos_backend.sql

          # Datos completamente ficticios, aislados del Supabase real.
          docker exec -i "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.areas(id, nombre) VALUES
            ('11111111-1111-4111-8111-111111111111', 'Area CI');
          INSERT INTO auth.users(id) VALUES
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333'),
            ('44444444-4444-4444-8444-444444444444'),
            ('55555555-5555-4555-8555-555555555555');
          INSERT INTO public.usuarios
            (id,area_id,nombre_completo,usuario,rol,habilitado)
          VALUES
            ('22222222-2222-4222-8222-222222222222',
             '11111111-1111-4111-8111-111111111111',
             'Representante CI','rep_v3v4_ci','REPRESENTANTE',true),
            ('33333333-3333-4333-8333-333333333333',
             '11111111-1111-4111-8111-111111111111',
             'Jefe CI','jefe_v3v4_ci','JEFE',true),
            ('44444444-4444-4444-8444-444444444444',
             '11111111-1111-4111-8111-111111111111',
             'Tecnico ajeno','otro_v3v4_ci','ASISTENTE',true),
            ('55555555-5555-4555-8555-555555555555',
             '11111111-1111-4111-8111-111111111111',
             'Tecnico titular','tecnico_v3v4_ci','PRACTICANTE',true);
          INSERT INTO public.incidencias
            (id,area_id,reportante_id,asunto,descripcion,estado,
             fecha_cierre,cerrado_por_usuario_id)
          VALUES
            ('88888888-8888-4888-8888-888888888888',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Ticket que se reabrira', 'Impresora con falla repetida',
             'Cerrado', now(), '55555555-5555-4555-8555-555555555555'),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Ticket V3 antes de migrar','Pendiente en V3',
             'Pendiente',NULL,NULL),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Ticket del ciclo 1','Pendiente tras migrar',
             'Pendiente',NULL,NULL),
            ('cccccccc-cccc-4ccc-8ccc-cccccccccccc',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Ticket cerrado ciclo 1','Pendiente de verificar',
             'Cerrado',now(),'55555555-5555-4555-8555-555555555555');
          INSERT INTO public.asignaciones
            (incidencia_id,tecnico_id,asignado_por_id,
             origen_asignacion,fecha_asignacion,fecha_fin)
          VALUES
            ('88888888-8888-4888-8888-888888888888',
             '55555555-5555-4555-8555-555555555555',
             '33333333-3333-4333-8333-333333333333',
             'JEFATURA',now()-interval '2 hours',now()-interval '1 hour');
          INSERT INTO public.intervenciones
            (incidencia_id,tecnico_id,diagnostico,acciones_realizadas,
             solucion_aplicada,es_solucion_final)
          VALUES
            ('88888888-8888-4888-8888-888888888888',
             '55555555-5555-4555-8555-555555555555',
             'Diagnostico historico','Atencion del primer ciclo',
             'Solucion antigua ciclo 1',true);
          SQL

          publicado="$(docker port "$contenedor" 5432/tcp)"
          export CI_PG_PORT="${publicado##*:}"
          test "$CI_PG_PORT" -gt 0

          python - <<'PY'
          import os
          import subprocess
          from types import SimpleNamespace
          from uuid import UUID

          from fastapi.testclient import TestClient
          from sqlalchemy import create_engine, text
          from sqlalchemy.orm import Session

          from app.main import app
          from app.auth import get_current_user
          from app.db import get_db

          AREA = UUID('11111111-1111-4111-8111-111111111111')
          REP = UUID('22222222-2222-4222-8222-222222222222')
          JEFE = UUID('33333333-3333-4333-8333-333333333333')
          TEC = UUID('55555555-5555-4555-8555-555555555555')
          TICKET = UUID('88888888-8888-4888-8888-888888888888')
          V3_PREVIO = UUID('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa')
          CICLO1 = UUID('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb')
          CERRADO1 = UUID('cccccccc-cccc-4ccc-8ccc-cccccccccccc')

          engine = create_engine(
              'postgresql+psycopg://soporte_ti_api:api_ci_temporal'
              f"@127.0.0.1:{os.environ['CI_PG_PORT']}/grocio_ci",
              pool_pre_ping=True,
          )
          usuario = {'id': TEC, 'rol': 'PRACTICANTE', 'area_id': AREA}

          def identidad_ci():
              return SimpleNamespace(**usuario)

          def sesion_ci():
              with Session(engine) as db:
                  yield db

          app.dependency_overrides[get_current_user] = identidad_ci
          app.dependency_overrides[get_db] = sesion_ci
          cliente = TestClient(app, raise_server_exceptions=False)

          def rol(uid, nombre):
              usuario.update(id=uid, rol=nombre)

          def comprobar(respuesta, codigo, descripcion):
              assert respuesta.status_code == codigo, (
                  f'{descripcion}: esperado {codigo}, '
                  f'obtenido {respuesta.status_code}: {respuesta.text[:700]}'
              )
              print(f'OK: {descripcion}')

          def consulta(sql, **params):
              with engine.connect() as conn:
                  return conn.execute(text(sql), params).mappings().all()

          def postgres(sql):
              proceso = subprocess.run([
                  'docker', 'exec', '-i', 'grocio-proteccion-v3-v4-ci',
                  'psql', '-X', '-U', 'postgres', '-d', 'grocio_ci',
                  '-v', 'ON_ERROR_STOP=1',
              ], input=sql, text=True, capture_output=True)
              assert proceso.returncode == 0, (proceso.stdout, proceso.stderr)

          def v3_tomar(ticket):
              return cliente.post(f'/api/asignaciones/{ticket}/tomar')

          def v3_intervenir(ticket):
              return cliente.post(f'/api/incidencias/{ticket}/intervenciones',json={
                  'diagnostico': 'Diagnostico posterior',
                  'acciones_realizadas': 'Reinicio de la impresora',
                  'solucion_aplicada': 'Solucion de prueba',
                  'es_solucion_final': True,
              })

          def v3_cerrar(ticket):
              return cliente.post(f'/api/incidencias/{ticket}/cerrar',json={
                  'resumen_cierre': 'Se verifico el funcionamiento del equipo y su conectividad.',
              })

          def totales():
              return consulta('''
                  SELECT
                    (SELECT count(*) FROM public.asignaciones
                     WHERE incidencia_id=:id) AS asignaciones,
                    (SELECT count(*) FROM public.intervenciones
                     WHERE incidencia_id=:id) AS intervenciones,
                    (SELECT count(*) FROM public.verificaciones
                     WHERE incidencia_id=:id) AS verificaciones,
                    (SELECT count(*) FROM public.historial_incidencias
                     WHERE incidencia_id=:id) AS eventos,
                    (SELECT estado FROM public.incidencias
                     WHERE id=:id) AS estado,
                    (SELECT ciclo_actual FROM public.incidencias
                     WHERE id=:id) AS ciclo
              ''', id=TICKET)[0]

          try:
              # La base original V3 debe continuar operativa.
              comprobar(v3_tomar(V3_PREVIO), 201,
                       'La ruta V3 opera en base V3 sin migracion')

              postgres(open('database/03_reapertura_v4.sql',encoding='utf-8').read())

              # Los tickets nuevos del primer ciclo siguen usando V3.
              comprobar(v3_tomar(CICLO1), 201,
                       'El ciclo 1 conserva las operaciones V3')

              # La verificacion antigua no debe saltarse la reapertura V4,
              # incluso si se trata del primer ciclo.
              rol(REP, 'REPRESENTANTE')
              comprobar(cliente.post(
                  f'/api/incidencias/{CERRADO1}/verificaciones',
                  json={'resultado':'Conformidad'},
              ), 409, 'Verificacion V3 deshabilitada tras habilitar V4')

              # Reapertura real y nueva asignacion mediante las rutas V4.
              reapertura = cliente.post(
                  f'/api/v4/incidencias/{TICKET}/verificaciones',
                  json={'resultado': 'Observación',
                        'observaciones': 'La falla continua tras cierre del ciclo 1'},
              )
              comprobar(reapertura,201,'El representante reabre el ciclo 2')
              assert reapertura.json()['ciclo_actual'] == 2

              rol(JEFE,'JEFE')
              asignacion = cliente.post(
                  f'/api/v4/incidencias/{TICKET}/asignar',
                  json={'tecnico_id':str(TEC)},
              )
              comprobar(asignacion,201,'V4 asigna tecnico al ciclo 2')
              assert asignacion.json()['ciclo_atencion'] == 2

              inicial = totales()
              assert inicial['estado'] == 'En revisión' and inicial['ciclo'] == 2

              # Las seis rutas antiguas deben quedar bloqueadas.
              rol(TEC,'PRACTICANTE')
              bloqueos = [
                  ('tomar', v3_tomar(TICKET)),
                  ('intervenir',v3_intervenir(TICKET)),
                  ('cerrar',v3_cerrar(TICKET)),
              ]
              rol(JEFE,'JEFE')
              bloqueos += [
                  ('asignar',cliente.post(
                      f'/api/asignaciones/{TICKET}/asignar',
                      json={'tecnico_id':str(TEC)},
                  )),
                  ('reasignar',cliente.post(
                      f'/api/asignaciones/{TICKET}/reasignar',
                      json={'nuevo_tecnico_id':str(TEC),
                            'motivo':'Cambio para pruebas de integridad'},
                  )),
              ]
              rol(REP,'REPRESENTANTE')
              bloqueos.append(('verificar',cliente.post(
                  f'/api/incidencias/{TICKET}/verificaciones',
                  json={'resultado':'Conformidad'},
              )))

              for nombre,respuesta in bloqueos:
                  comprobar(respuesta,409,f'V3 {nombre} bloqueado en ciclo 2')
                 
              assert 'v4' in str(respuesta.json().get('detail', '')).lower(), (
                  nombre, respuesta.json()
              )

              assert totales() == inicial, (
                  'Una operacion V3 altero datos del ticket reabierto',
                  inicial, totales(),
              )
              print('OK: Ninguna ruta V3 modifico registros del ciclo 2')

              # Los GET anteriores siguen siendo compatibles.
              comprobar(cliente.get(f'/api/incidencias/{TICKET}'),200,
                       'Consulta GET V3 conserva acceso')
              comprobar(cliente.get(
                  f'/api/incidencias/{TICKET}/verificaciones'),200,
                  'Consulta GET de verificaciones permanece disponible')

              # La ruta V4 sigue operando tras activar la proteccion.
              rol(TEC,'PRACTICANTE')
              intervencion = cliente.post(
                  f'/api/v4/incidencias/{TICKET}/intervenciones',json={
                      'diagnostico':'Falla persistente del equipo',
                      'acciones_realizadas':'Reemplazo de componente',
                      'solucion_aplicada':'Componente nuevo instalado y probado',
                      'es_solucion_final': True,
                  },
              )
              comprobar(intervencion,201,'Intervencion V4 sigue operativa')
              cierre = cliente.post(f'/api/v4/incidencias/{TICKET}/cerrar',json={
                  'resumen_cierre':'Se reemplazo el componente averiado y se comprobo la impresion.',
              })
              comprobar(cierre,200,'Cierre V4 sigue operativo')
              assert cierre.json()['ciclo_atencion'] == 2
              actual = consulta('''
                  SELECT estado,ciclo_actual FROM public.incidencias
                  WHERE id=:id
              ''',id=TICKET)[0]
              assert actual['estado'] == 'Cerrado'
              assert actual['ciclo_actual'] == 2

              print('PASO 109D9E APROBADO: SOLO POSTGRESQL TEMPORAL')
          finally:
              app.dependency_overrides.clear()
              engine.dispose()
          PY
