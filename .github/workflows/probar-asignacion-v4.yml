name: Probar asignacion reabierta V4

on:
  push:
    branches:
      - ajustes-docente-v4
    paths:
      - "backend/app/routes/v4_asignaciones.py"
      - "backend/app/routes/v4_verificaciones.py"
      - "database/03_reapertura_v4.sql"
      - ".github/workflows/probar-asignacion-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asignacion-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "httpx>=0.28,<1"

      - name: Probar asignaciones por ciclo en PostgreSQL temporal
        shell: bash
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          contenedor="grocio-asignacion-v4-ci"
          docker run -d --rm \
            --name "$contenedor" \
            -p 127.0.0.1:55436:5432 \
            -e POSTGRES_DB=grocio_ci \
            -e POSTGRES_PASSWORD=clave_ci_temporal \
            -v "$GITHUB_WORKSPACE/database:/sql:ro" \
            postgres:16 >/dev/null
          trap 'docker rm -f "$contenedor" >/dev/null 2>&1 || true' EXIT

          listo=0
          for intento in {1..40}; do
            if docker exec -e PGPASSWORD=clave_ci_temporal "$contenedor" \
               psql -X -h 127.0.0.1 -U postgres -d grocio_ci \
               -Atq -c 'SELECT 1' >/dev/null 2>&1; then
              listo=1
              break
            fi
            sleep 1
          done
          test "$listo" -eq 1 || {
            echo 'La base temporal no estuvo disponible'
            exit 1
          }

          docker exec -i "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id UUID PRIMARY KEY);
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE soporte_ti_api LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT
            PASSWORD 'api_ci_temporal';
          SQL

          docker exec "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/01_esquema_mvp.sql
          docker exec "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/02_permisos_backend.sql

          docker exec -i "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.areas(id, nombre) VALUES
            ('11111111-1111-4111-8111-111111111111', 'Area de pruebas');
          INSERT INTO auth.users(id) VALUES
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333'),
            ('44444444-4444-4444-8444-444444444444'),
            ('55555555-5555-4555-8555-555555555555'),
            ('66666666-6666-4666-8666-666666666666');
          INSERT INTO public.usuarios
            (id, area_id, nombre_completo, usuario, rol, habilitado)
          VALUES
            ('22222222-2222-4222-8222-222222222222',
             '11111111-1111-4111-8111-111111111111',
             'Representante CI', 'representante_ci', 'REPRESENTANTE', true),
            ('33333333-3333-4333-8333-333333333333',
             '11111111-1111-4111-8111-111111111111',
             'Jefe CI', 'jefe_ci', 'JEFE', true),
            ('44444444-4444-4444-8444-444444444444',
             '11111111-1111-4111-8111-111111111111',
             'Tecnico anterior CI', 'tecnico_anterior_ci', 'ASISTENTE', true),
            ('55555555-5555-4555-8555-555555555555',
             '11111111-1111-4111-8111-111111111111',
             'Tecnico nuevo CI', 'tecnico_nuevo_ci', 'PRACTICANTE', true),
            ('66666666-6666-4666-8666-666666666666',
             '11111111-1111-4111-8111-111111111111',
             'Tecnico bloqueado CI', 'tecnico_bloqueado_ci', 'ASISTENTE', false);

          INSERT INTO public.incidencias
            (id, area_id, reportante_id, asunto, descripcion,
             estado, fecha_cierre, cerrado_por_usuario_id)
          VALUES
            ('77777777-7777-4777-8777-777777777777',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Impresora con falla', 'El fallo persiste',
             'Cerrado', now(), '33333333-3333-4333-8333-333333333333'),
            ('88888888-8888-4888-8888-888888888888',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Ticket sin reapertura', 'Sin observacion',
             'Pendiente', NULL, NULL);
          INSERT INTO public.asignaciones
            (incidencia_id, tecnico_id, asignado_por_id,
             origen_asignacion, fecha_asignacion, fecha_fin)
          VALUES
            ('77777777-7777-4777-8777-777777777777',
             '44444444-4444-4444-8444-444444444444',
             '33333333-3333-4333-8333-333333333333',
             'JEFATURA', now() - interval '1 hour',
             now() - interval '30 minutes');
          SQL

          python - <<'PY'
          from types import SimpleNamespace
          from uuid import UUID
          import subprocess

          from fastapi.testclient import TestClient
          from sqlalchemy import create_engine, text
          from sqlalchemy.orm import Session
          from app.main import app
          from app.auth import get_current_user
          from app.db import get_db

          REP = UUID('22222222-2222-4222-8222-222222222222')
          JEFE = UUID('33333333-3333-4333-8333-333333333333')
          AREA = UUID('11111111-1111-4111-8111-111111111111')
          NUEVO = UUID('55555555-5555-4555-8555-555555555555')
          BLOQUEADO = UUID('66666666-6666-4666-8666-666666666666')
          TICKET = UUID('77777777-7777-4777-8777-777777777777')
          SIN_CICLO = UUID('88888888-8888-4888-8888-888888888888')

          engine = create_engine(
              'postgresql+psycopg://soporte_ti_api:api_ci_temporal'
              '@127.0.0.1:55436/grocio_ci'
          )
          identidad = {'id': JEFE, 'rol': 'JEFE', 'area_id': AREA}

          def usuario_ci():
              return SimpleNamespace(**identidad)

          def sesion_ci():
              with Session(engine) as db:
                  yield db

          app.dependency_overrides[get_current_user] = usuario_ci
          app.dependency_overrides[get_db] = sesion_ci
          cliente = TestClient(app, raise_server_exceptions=False)

          def asignar(ticket, tecnico):
              return cliente.post(
                  f'/api/v4/incidencias/{ticket}/asignar',
                  json={'tecnico_id': str(tecnico)}
              )

          def comprobar(respuesta, codigo, descripcion):
              assert respuesta.status_code == codigo, (
                  f'{descripcion}: esperado {codigo}; '
                  f'recibido {respuesta.status_code}: {respuesta.text[:500]}'
              )
              print(f'OK: {descripcion}')

          def consultar(consulta, **params):
              with engine.connect() as db:
                  return db.execute(text(consulta), params).mappings().all()

          try:
              comprobar(asignar(TICKET, NUEVO), 503, 'Base V3 protegida')
              subprocess.run([
                  'docker', 'exec', 'grocio-asignacion-v4-ci',
                  'psql', '-X', '-U', 'postgres', '-d', 'grocio_ci',
                  '-v', 'ON_ERROR_STOP=1', '-f', '/sql/03_reapertura_v4.sql'
              ], check=True)

              comprobar(asignar(SIN_CICLO, NUEVO), 409, 'Ciclo 1 usa V3')
              subprocess.run([
                  'docker', 'exec', 'grocio-asignacion-v4-ci',
                  'psql', '-X', '-U', 'postgres', '-d', 'grocio_ci',
                  '-v', 'ON_ERROR_STOP=1', '-c',
                  "UPDATE public.incidencias SET ciclo_actual=2, "
                  "estado='En revisión' "
                  "WHERE id='88888888-8888-4888-8888-888888888888'",
              ], check=True)
              comprobar(asignar(SIN_CICLO, NUEVO), 409, 'Sin observacion previa')
              identidad.update(id=REP, rol='REPRESENTANTE')
              comprobar(asignar(TICKET, NUEVO), 403, 'Rol representante rechazado')
              respuesta = cliente.post(
                  f'/api/v4/incidencias/{TICKET}/verificaciones',
                  json={'resultado': 'Observación',
                        'observaciones': 'La impresora vuelve a fallar'}
              )
              comprobar(respuesta, 201, 'Representante reabre el ticket')
              assert respuesta.json()['ciclo_actual'] == 2
              identidad.update(id=JEFE, rol='JEFE')

              comprobar(asignar(TICKET, BLOQUEADO), 422, 'Tecnico deshabilitado')
              respuesta = asignar(TICKET, NUEVO)
              comprobar(respuesta, 201, 'Nueva asignacion en ciclo 2')
              assert respuesta.json()['ciclo_atencion'] == 2
              assert respuesta.json()['tecnico_id'] == str(NUEVO)

              filas = consultar('''
                  SELECT tecnico_id, ciclo_atencion, fecha_fin
                  FROM public.asignaciones
                  WHERE incidencia_id = :ticket
                  ORDER BY ciclo_atencion
              ''', ticket=TICKET)
              assert len(filas) == 2, filas
              assert filas[0]['ciclo_atencion'] == 1
              assert filas[0]['fecha_fin'] is not None
              assert filas[1]['ciclo_atencion'] == 2
              assert filas[1]['tecnico_id'] == NUEVO
              assert filas[1]['fecha_fin'] is None
              print('OK: historial del ciclo 1 preservado')

              eventos = consultar('''
                  SELECT ciclo_atencion, accion
                  FROM public.historial_incidencias
                  WHERE incidencia_id = :ticket AND accion = 'ASIGNACION'
              ''', ticket=TICKET)
              assert len(eventos) == 1 and eventos[0]['ciclo_atencion'] == 2
              comprobar(asignar(TICKET, NUEVO), 409, 'Asignacion duplicada bloqueada')
              assert len(consultar('''
                  SELECT id FROM public.asignaciones WHERE incidencia_id=:ticket
              ''', ticket=TICKET)) == 2
              print('PASO 109D7D APROBADO: SIN MODIFICAR SUPABASE REAL')
          finally:
              app.dependency_overrides.clear()
              engine.dispose()
          PY
