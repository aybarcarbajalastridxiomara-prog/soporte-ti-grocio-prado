
name: Probar migracion V4

on:
  push:
    branches:
      - ajustes-docente-v4
    paths:
      - "database/03_reapertura_v4.sql"
      - ".github/workflows/probar-migracion-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-migracion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Paso 109C2 - Probar migracion en PostgreSQL temporal
        shell: bash
        run: |
          set -euo pipefail

          CONTENEDOR="grocio-pg-v4-109c2"

          docker run --detach --rm \
            --name "$CONTENEDOR" \
            -e POSTGRES_PASSWORD=clave_temporal_ci \
            -e POSTGRES_DB=grocio_v4_ci \
            -v "$GITHUB_WORKSPACE/database:/sql:ro" \
            postgres:16 >/dev/null

          trap 'docker rm -f grocio-pg-v4-109c2 >/dev/null 2>&1 || true' EXIT

          listo=0
          for intento in {1..30}; do
            if docker exec "$CONTENEDOR" \
              pg_isready -U postgres -d grocio_v4_ci \
              >/dev/null 2>&1; then
              listo=1
              break
            fi
            sleep 2
          done

          test "$listo" -eq 1

          # Preparar dependencias ficticias de Supabase.
          docker exec -i "$CONTENEDOR" \
            psql -U postgres -d grocio_v4_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id UUID PRIMARY KEY);
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE soporte_ti_api
            LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT;
          SQL

          # Instalar esquema y permisos iniciales.
          docker exec "$CONTENEDOR" \
            psql -U postgres -d grocio_v4_ci \
            -v ON_ERROR_STOP=1 \
            -f /sql/01_esquema_mvp.sql

          docker exec "$CONTENEDOR" \
            psql -U postgres -d grocio_v4_ci \
            -v ON_ERROR_STOP=1 \
            -f /sql/02_permisos_backend.sql

          # Crear datos ficticios ANTES de migrar.
          docker exec -i "$CONTENEDOR" \
            psql -U postgres -d grocio_v4_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.areas (id, nombre)
          VALUES (
            '11111111-1111-4111-8111-111111111111',
            'Area ficticia CI'
          );

          INSERT INTO auth.users (id) VALUES
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333');

          INSERT INTO public.usuarios (
            id, area_id, nombre_completo, usuario, rol
          ) VALUES
          (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'Jefe CI', 'jefe_v4_ci', 'JEFE'
          ),
          (
            '33333333-3333-4333-8333-333333333333',
            '11111111-1111-4111-8111-111111111111',
            'Representante CI', 'rep_v4_ci', 'REPRESENTANTE'
          );

          INSERT INTO public.incidencias (
            id, area_id, reportante_id,
            asunto, descripcion, estado,
            fecha_cierre, cerrado_por_usuario_id
          ) VALUES (
            '44444444-4444-4444-8444-444444444444',
            '11111111-1111-4111-8111-111111111111',
            '33333333-3333-4333-8333-333333333333',
            'Impresora ficticia',
            'Incidencia creada para probar migracion',
            'Cerrado',
            now(),
            '22222222-2222-4222-8222-222222222222'
          );

          INSERT INTO public.verificaciones (
            incidencia_id, usuario_id,
            resultado, observaciones
          ) VALUES (
            '44444444-4444-4444-8444-444444444444',
            '33333333-3333-4333-8333-333333333333',
            'Observación',
            'Primera observacion ficticia'
          );
          SQL

          # Aplicar la migracion SOLO en PostgreSQL temporal.
          docker exec "$CONTENEDOR" \
            psql -U postgres -d grocio_v4_ci \
            -v ON_ERROR_STOP=1 \
            -f /sql/03_reapertura_v4.sql

          # Validar estructura, integridad y ciclos.
          docker exec -i "$CONTENEDOR" \
            psql -U postgres -d grocio_v4_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            ticket UUID :=
              '44444444-4444-4444-8444-444444444444';
            representante UUID :=
              '33333333-3333-4333-8333-333333333333';
            jefe UUID :=
              '22222222-2222-4222-8222-222222222222';
          BEGIN

            IF (
              SELECT ciclo_actual
              FROM public.incidencias
              WHERE id = ticket
            ) <> 1 THEN
              RAISE EXCEPTION 'Ciclo inicial incorrecto';
            END IF;

            IF (
              SELECT count(*)
              FROM public.verificaciones
              WHERE incidencia_id = ticket
                AND ciclo_atencion = 1
            ) <> 1 THEN
              RAISE EXCEPTION 'Se perdio la verificacion original';
            END IF;

            IF to_regclass(
              'public.ux_verificaciones_incidencia'
            ) IS NOT NULL THEN
              RAISE EXCEPTION 'Indice antiguo no sustituido';
            END IF;

            IF to_regclass(
              'public.ux_verificaciones_incidencia_ciclo'
            ) IS NULL THEN
              RAISE EXCEPTION 'Falta indice unico por ciclo';
            END IF;

            -- Simular un nuevo ciclo, solo en CI.
            UPDATE public.incidencias
            SET ciclo_actual = 2,
                estado = 'En revisión',
                fecha_cierre = NULL,
                cerrado_por_usuario_id = NULL
            WHERE id = ticket;

            UPDATE public.incidencias
            SET estado = 'Cerrado',
                fecha_cierre = now(),
                cerrado_por_usuario_id = jefe
            WHERE id = ticket;

            INSERT INTO public.verificaciones (
              incidencia_id, usuario_id,
              resultado, ciclo_atencion
            ) VALUES (
              ticket, representante,
              'Conformidad', 2
            );

            -- Rechazar dos verificaciones del mismo ciclo.
            BEGIN
              INSERT INTO public.verificaciones (
                incidencia_id, usuario_id,
                resultado, ciclo_atencion
              ) VALUES (
                ticket, representante,
                'Conformidad', 2
              );

              RAISE EXCEPTION
                'Se permitio verificacion duplicada';

            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;

            IF (
              SELECT count(*)
              FROM public.verificaciones
              WHERE incidencia_id = ticket
            ) <> 2 THEN
              RAISE EXCEPTION
                'Numero de verificaciones incorrecto';
            END IF;

            IF NOT (
              SELECT relrowsecurity
              FROM pg_class
              WHERE oid = 'public.verificaciones'::regclass
            ) THEN
              RAISE EXCEPTION 'RLS deshabilitado';
            END IF;

            IF NOT has_table_privilege(
              'soporte_ti_api',
              'public.verificaciones',
              'INSERT'
            ) THEN
              RAISE EXCEPTION 'Se perdieron permisos backend';
            END IF;

            RAISE NOTICE
              'Migracion V4 estructural aprobada';

          END;
          $$;
          SQL

          echo "Paso 109C2 aprobado: migracion probada en PostgreSQL temporal"
