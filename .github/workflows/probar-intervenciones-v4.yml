name: Probar intervenciones por ciclo V4

on:
  push:
    branches:
      - ajustes-docente-v4
    paths:
      - "backend/app/routes/v4_intervenciones.py"
      - "backend/app/routes/v4_asignaciones.py"
      - "backend/app/routes/v4_verificaciones.py"
      - "backend/app/main.py"
      - "database/03_reapertura_v4.sql"
      - ".github/workflows/probar-intervenciones-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intervenciones-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "httpx>=0.28,<1"

      - name: Paso 109D7F - Probar intervenciones en PostgreSQL temporal
        shell: bash
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail

          contenedor="grocio-intervencion-v4-ci"
          docker run -d --rm \
            --name "$contenedor" \
            -p 127.0.0.1:55437:5432 \
            -e POSTGRES_DB=grocio_ci \
            -e POSTGRES_PASSWORD=clave_ci_temporal \
            -v "$GITHUB_WORKSPACE/database:/sql:ro" \
            postgres:16 >/dev/null
          trap 'docker rm -f "$contenedor" >/dev/null 2>&1 || true' EXIT

          # Esperar una consulta real a la base, no solo el puerto.
          listo=0
          for intento in {1..40}; do
            if docker exec -e PGPASSWORD=clave_ci_temporal "$contenedor" \
              psql -X -h 127.0.0.1 -U postgres -d grocio_ci \
              -Atq -c 'SELECT 1' >/dev/null 2>&1; then
              listo=1
              break
            fi
            sleep 1
          done
          if [ "$listo" -ne 1 ]; then
            echo 'ERROR: PostgreSQL de CI no inicializo la base grocio_ci'
            exit 1
          fi

          docker exec -i "$contenedor" \
            psql -X -U postgres -d grocio_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id UUID PRIMARY KEY);
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE soporte_ti_api LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT
            PASSWORD 'api_ci_temporal';
          SQL

          docker exec "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/01_esquema_mvp.sql
          docker exec "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/02_permisos_backend.sql

          # Datos aislados y ficticios; el ciclo historico es el 1.
          docker exec -i "$contenedor" \
            psql -X -U postgres -d grocio_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.areas(id, nombre) VALUES
            ('11111111-1111-4111-8111-111111111111', 'Area de pruebas A'),
            ('99999999-9999-4999-8999-999999999999', 'Area de pruebas B');
          INSERT INTO auth.users(id) VALUES
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333'),
            ('44444444-4444-4444-8444-444444444444'),
            ('55555555-5555-4555-8555-555555555555'),
            ('66666666-6666-4666-8666-666666666666'),
            ('77777777-7777-4777-8777-777777777777');
          INSERT INTO public.usuarios
            (id, area_id, nombre_completo, usuario, rol, habilitado)
          VALUES
            ('22222222-2222-4222-8222-222222222222',
             '11111111-1111-4111-8111-111111111111',
             'Representante A', 'rep_a_ci', 'REPRESENTANTE', true),
            ('33333333-3333-4333-8333-333333333333',
             '11111111-1111-4111-8111-111111111111',
             'Jefe CI', 'jefe_ci', 'JEFE', true),
            ('44444444-4444-4444-8444-444444444444',
             '11111111-1111-4111-8111-111111111111',
             'Tecnico anterior', 'tecnico_viejo_ci', 'ASISTENTE', true),
            ('55555555-5555-4555-8555-555555555555',
             '11111111-1111-4111-8111-111111111111',
             'Tecnico actual', 'tecnico_nuevo_ci', 'PRACTICANTE', true),
            ('66666666-6666-4666-8666-666666666666',
             '11111111-1111-4111-8111-111111111111',
             'Tecnico ajeno', 'tecnico_ajeno_ci', 'ASISTENTE', true),
            ('77777777-7777-4777-8777-777777777777',
             '99999999-9999-4999-8999-999999999999',
             'Representante B', 'rep_b_ci', 'REPRESENTANTE', true);

          INSERT INTO public.incidencias
            (id, area_id, reportante_id, asunto, descripcion,
             estado, fecha_cierre, cerrado_por_usuario_id)
          VALUES
            ('88888888-8888-4888-8888-888888888888',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Falla de impresora', 'Error de impresion',
             'Cerrado', now(), '33333333-3333-4333-8333-333333333333'),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Incidencia sin ciclo nuevo', 'Ticket pendiente',
             'Pendiente', NULL, NULL);
          INSERT INTO public.asignaciones
            (incidencia_id, tecnico_id, asignado_por_id,
             origen_asignacion, fecha_asignacion, fecha_fin)
          VALUES
            ('88888888-8888-4888-8888-888888888888',
             '44444444-4444-4444-8444-444444444444',
             '33333333-3333-4333-8333-333333333333',
             'JEFATURA', now() - interval '2 hours', now() - interval '1 hour');
          INSERT INTO public.intervenciones
            (incidencia_id, tecnico_id, diagnostico,
             acciones_realizadas, solucion_aplicada, es_solucion_final)
          VALUES
            ('88888888-8888-4888-8888-888888888888',
             '44444444-4444-4444-8444-444444444444',
             'Atencion antigua', 'Reinicio de cola', 'Reinicio del servicio', true);
          INSERT INTO public.historial_incidencias
            (incidencia_id, usuario_id, accion, descripcion)
          VALUES
            ('88888888-8888-4888-8888-888888888888',
             '44444444-4444-4444-8444-444444444444',
             'INTERVENCION', 'Atencion historica del ciclo 1');
          SQL

          python - <<'PY'
          from types import SimpleNamespace
          from uuid import UUID
          import subprocess

          from fastapi.testclient import TestClient
          from sqlalchemy import create_engine, text
          from sqlalchemy.orm import Session

          from app.auth import get_current_user
          from app.db import get_db
          from app.main import app

          AREA = UUID('11111111-1111-4111-8111-111111111111')
          AREA_B = UUID('99999999-9999-4999-8999-999999999999')
          REP = UUID('22222222-2222-4222-8222-222222222222')
          JEFE = UUID('33333333-3333-4333-8333-333333333333')
          VIEJO = UUID('44444444-4444-4444-8444-444444444444')
          NUEVO = UUID('55555555-5555-4555-8555-555555555555')
          AJENO = UUID('66666666-6666-4666-8666-666666666666')
          REP_B = UUID('77777777-7777-4777-8777-777777777777')
          TICKET = UUID('88888888-8888-4888-8888-888888888888')
          SIN_CICLO = UUID('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa')

          engine = create_engine(
              'postgresql+psycopg://soporte_ti_api:api_ci_temporal'
              '@127.0.0.1:55437/grocio_ci'
          )
          actual = {'id': NUEVO, 'rol': 'PRACTICANTE', 'area_id': AREA}

          def usuario_ci():
              return SimpleNamespace(**actual)

          def db_ci():
              with Session(engine) as session:
                  yield session

          app.dependency_overrides[get_current_user] = usuario_ci
          app.dependency_overrides[get_db] = db_ci
          cliente = TestClient(app, raise_server_exceptions=False)

          DATOS = {
              'diagnostico': 'Fusor desgastado',
              'acciones_realizadas': 'Se cambio el fusor de la impresora',
              'duracion_minutos': 35,
              'solucion_aplicada': 'Reemplazo del fusor',
              'es_solucion_final': True,
          }

          def cambiar(id_, rol, area=AREA):
              actual.update(id=id_, rol=rol, area_id=area)

          def intervenir(ticket=TICKET, datos=None):
              return cliente.post(
                  f'/api/v4/incidencias/{ticket}/intervenciones',
                  json=DATOS if datos is None else datos,
              )

          def listar(ticket=TICKET):
              return cliente.get(f'/api/v4/incidencias/{ticket}/intervenciones')

          def comprobar(r, esperado, nombre):
              assert r.status_code == esperado, (
                  f'{nombre}: esperado {esperado}, recibido '
                  f'{r.status_code}: {r.text[:500]}'
              )
              print('OK:', nombre)

          def filas(sql, **params):
              with engine.connect() as db:
                  return db.execute(text(sql), params).mappings().all()

          def admin(sql):
              subprocess.run([
                  'docker', 'exec', 'grocio-intervencion-v4-ci',
                  'psql', '-X', '-U', 'postgres', '-d', 'grocio_ci',
                  '-v', 'ON_ERROR_STOP=1', '-c', sql,
              ], check=True)

          try:
              # El backend V4 no debe tocar una base sin migracion.
              comprobar(intervenir(), 503, 'V3 protegida')
              comprobar(listar(), 503, 'Listado V4 protegido en V3')

              subprocess.run([
                  'docker', 'exec', 'grocio-intervencion-v4-ci',
                  'psql', '-X', '-U', 'postgres', '-d', 'grocio_ci',
                  '-v', 'ON_ERROR_STOP=1', '-f', '/sql/03_reapertura_v4.sql',
              ], check=True)

              # Ninguna intervencion V4 se crea en el ciclo inicial.
              comprobar(intervenir(SIN_CICLO), 409, 'Ciclo 1 mantiene ruta V3')

              # Reapertura real de un ticket cerrado.
              cambiar(REP, 'REPRESENTANTE')
              r = cliente.post(
                  f'/api/v4/incidencias/{TICKET}/verificaciones',
                  json={
                      'resultado': 'Observación',
                      'observaciones': 'La impresora volvio a fallar',
                  },
              )
              comprobar(r, 201, 'Observacion y reapertura')
              assert r.json()['ciclo_actual'] == 2

              cambiar(NUEVO, 'PRACTICANTE')
              comprobar(intervenir(), 409, 'Requiere asignacion del ciclo 2')

              cambiar(JEFE, 'JEFE')
              r = cliente.post(
                  f'/api/v4/incidencias/{TICKET}/asignar',
                  json={'tecnico_id': str(NUEVO)},
              )
              comprobar(r, 201, 'Jefe asigna tecnico al ciclo 2')
              assert r.json()['ciclo_atencion'] == 2

              cambiar(REP, 'REPRESENTANTE')
              comprobar(intervenir(), 403, 'Representante no registra intervenciones')

              cambiar(VIEJO, 'ASISTENTE')
              comprobar(intervenir(), 403, 'Tecnico del ciclo anterior rechazado')

              cambiar(AJENO, 'ASISTENTE')
              comprobar(intervenir(), 403, 'Tecnico no asignado rechazado')

              cambiar(NUEVO, 'PRACTICANTE')
              invalido = {**DATOS, 'solucion_aplicada': '   '}
              comprobar(intervenir(datos=invalido), 422, 'Solucion final vacia rechazada')
              assert len(filas(
                  'SELECT id FROM public.intervenciones WHERE incidencia_id=:id',
                  id=TICKET,
              )) == 1

              r = intervenir()
              comprobar(r, 201, 'Intervencion nueva registrada en ciclo 2')
              assert r.json()['ciclo_atencion'] == 2
              assert r.json()['es_solucion_final'] is True
              assert r.json()['tecnico_id'] == str(NUEVO)

              # Preservar ambos ciclos en PostgreSQL y en el API.
              intervenciones = filas('''
                  SELECT ciclo_atencion, tecnico_id, solucion_aplicada,
                         es_solucion_final
                  FROM public.intervenciones
                  WHERE incidencia_id=:id
                  ORDER BY ciclo_atencion
              ''', id=TICKET)
              assert len(intervenciones) == 2, intervenciones
              assert intervenciones[0]['ciclo_atencion'] == 1
              assert intervenciones[0]['tecnico_id'] == VIEJO
              assert intervenciones[0]['solucion_aplicada'] == 'Reinicio del servicio'
              assert intervenciones[1]['ciclo_atencion'] == 2
              assert intervenciones[1]['tecnico_id'] == NUEVO
              assert intervenciones[1]['solucion_aplicada'] == 'Reemplazo del fusor'
              print('OK: ciclo 1 conservado y ciclo 2 independiente')

              historial = filas('''
                  SELECT ciclo_atencion, descripcion
                  FROM public.historial_incidencias
                  WHERE incidencia_id=:id AND accion='INTERVENCION'
                  ORDER BY ciclo_atencion
              ''', id=TICKET)
              assert len(historial) == 2
              assert [h['ciclo_atencion'] for h in historial] == [1, 2]
              print('OK: historial tecnico de ambos ciclos')

              comprobar(listar(), 200, 'Tecnico consulta historial completo')
              assert [x['ciclo_atencion'] for x in listar().json()] == [1, 2]

              cambiar(REP, 'REPRESENTANTE')
              comprobar(listar(), 200, 'Representante del area consulta historial')
              cambiar(REP_B, 'REPRESENTANTE', AREA_B)
              comprobar(listar(), 404, 'Representante de otra area rechazado')

              # Una transaccion fallida no debe dejar intervenciones sueltas.
              cambiar(NUEVO, 'PRACTICANTE')
              admin('''
                  CREATE FUNCTION public.error_intervencion_v4_ci()
                  RETURNS trigger LANGUAGE plpgsql AS $$
                  BEGIN
                    IF NEW.accion = 'INTERVENCION' AND NEW.ciclo_atencion = 2 THEN
                      RAISE EXCEPTION 'Error simulado para rollback CI';
                    END IF;
                    RETURN NEW;
                  END $$;
                  CREATE TRIGGER trg_error_intervencion_v4_ci
                  BEFORE INSERT ON public.historial_incidencias
                  FOR EACH ROW EXECUTE FUNCTION public.error_intervencion_v4_ci();
              ''')
              comprobar(intervenir(), 500, 'Rollback por error en historial')
              assert len(filas('''
                  SELECT id FROM public.intervenciones WHERE incidencia_id=:id
              ''', id=TICKET)) == 2
              print('OK: no hay intervenciones parciales tras rollback')

              # En una incidencia ya cerrada, no se aceptan mas atenciones.
              admin('''
                  UPDATE public.incidencias
                  SET estado='Cerrado', fecha_cierre=now(),
                      cerrado_por_usuario_id='33333333-3333-4333-8333-333333333333'
                  WHERE id='88888888-8888-4888-8888-888888888888';
              ''')
              comprobar(intervenir(), 409, 'Incidencia cerrada no editable')
              print('PASO 109D7F APROBADO - SOLO POSTGRESQL TEMPORAL')
          finally:
              app.dependency_overrides.clear()
              engine.dispose()
          PY
