name: Probar cierre tecnico por ciclo V4

on:
  push:
    branches:
      - ajustes-docente-v4
    paths:
      - "backend/app/routes/v4_cierres.py"
      - "backend/app/routes/v4_intervenciones.py"
      - "backend/app/routes/v4_asignaciones.py"
      - "backend/app/routes/v4_verificaciones.py"
      - "backend/app/v4_reglas.py"
      - "backend/app/main.py"
      - "database/03_reapertura_v4.sql"
      - ".github/workflows/probar-cierre-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cierre-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "httpx>=0.28,<1"
      - name: Paso 109D8C - Probar cierre V4 en PostgreSQL temporal
        shell: bash
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          contenedor=grocio-cierre-v4-ci
          docker run -d --rm --name "$contenedor" \
            -p 127.0.0.1::5432 \
            -e POSTGRES_DB=grocio_ci \
            -e POSTGRES_PASSWORD=clave_ci_temporal \
            -v "$GITHUB_WORKSPACE/database:/sql:ro" \
            postgres:16 >/dev/null
          trap 'docker rm -f "$contenedor" >/dev/null 2>&1 || true' EXIT
          listo=0
          for intento in {1..40}; do
            if docker exec -e PGPASSWORD=clave_ci_temporal "$contenedor" \
              psql -X -h 127.0.0.1 -U postgres -d grocio_ci \
              -Atq -c 'SELECT 1' >/dev/null 2>&1; then
              listo=1
              break
            fi
            sleep 1
          done
          if [ "$listo" -ne 1 ]; then
            echo 'ERROR: la base grocio_ci no estuvo lista'
            exit 1
          fi
          docker exec -i "$contenedor" psql -X -U postgres -d grocio_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id UUID PRIMARY KEY);
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE soporte_ti_api LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT
            PASSWORD 'api_ci_temporal';
          SQL
          docker exec "$contenedor" psql -X -U postgres -d grocio_ci -v ON_ERROR_STOP=1 -f /sql/01_esquema_mvp.sql
          docker exec "$contenedor" psql -X -U postgres -d grocio_ci -v ON_ERROR_STOP=1 -f /sql/02_permisos_backend.sql
          docker exec -i "$contenedor" psql -X -U postgres -d grocio_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.areas(id,nombre) VALUES
           ('11111111-1111-4111-8111-111111111111','Area CI');
          INSERT INTO auth.users(id) VALUES
           ('22222222-2222-4222-8222-222222222222'),
           ('33333333-3333-4333-8333-333333333333'),
           ('44444444-4444-4444-8444-444444444444'),
           ('55555555-5555-4555-8555-555555555555');
          INSERT INTO public.usuarios(id,area_id,nombre_completo,usuario,rol,habilitado) VALUES
           ('22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111','Representante CI','rep_ci','REPRESENTANTE',true),
           ('33333333-3333-4333-8333-333333333333',
            '11111111-1111-4111-8111-111111111111','Jefe CI','jefe_ci','JEFE',true),
           ('44444444-4444-4444-8444-444444444444',
            '11111111-1111-4111-8111-111111111111','Tecnico ajeno','otro_ci','ASISTENTE',true),
           ('55555555-5555-4555-8555-555555555555',
            '11111111-1111-4111-8111-111111111111','Tecnico titular','tecnico_ci','PRACTICANTE',true);
          INSERT INTO public.incidencias
           (id,area_id,reportante_id,asunto,descripcion,estado,fecha_cierre,cerrado_por_usuario_id)
          VALUES
           ('88888888-8888-4888-8888-888888888888',
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            'Incidencia previamente cerrada','Equipo sin respuesta','Cerrado',now(),
            '55555555-5555-4555-8555-555555555555'),
           ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            'Incidencia inicial','Sin ciclo nuevo','Pendiente',NULL,NULL);
          INSERT INTO public.asignaciones
           (incidencia_id,tecnico_id,asignado_por_id,origen_asignacion,fecha_asignacion,fecha_fin)
          VALUES
           ('88888888-8888-4888-8888-888888888888',
            '55555555-5555-4555-8555-555555555555',
            '33333333-3333-4333-8333-333333333333',
            'JEFATURA',now()-interval '2 hours',now()-interval '1 hour');
          INSERT INTO public.intervenciones
           (incidencia_id,tecnico_id,diagnostico,acciones_realizadas,solucion_aplicada,es_solucion_final)
          VALUES
           ('88888888-8888-4888-8888-888888888888',
            '55555555-5555-4555-8555-555555555555',
            'Diagnostico ciclo 1','Atencion anterior','Solucion ANTIGUA ciclo 1',true);
          INSERT INTO public.historial_incidencias
           (incidencia_id,usuario_id,accion,descripcion)
          VALUES
           ('88888888-8888-4888-8888-888888888888',
            '55555555-5555-4555-8555-555555555555',
            'CIERRE','Cierre historico ciclo 1');
          SQL
          publicado="$(docker port "$contenedor" 5432/tcp)"
          export CI_PG_PORT="${publicado##*:}"
          test "$CI_PG_PORT" -gt 0
          python - <<'PY'
          from types import SimpleNamespace
          from uuid import UUID
          import os
          import subprocess
          from fastapi.testclient import TestClient
          from sqlalchemy import create_engine, text
          from sqlalchemy.orm import Session
          from app.main import app
          from app.auth import get_current_user
          from app.db import get_db

          REP = UUID('22222222-2222-4222-8222-222222222222')
          JEFE = UUID('33333333-3333-4333-8333-333333333333')
          OTRO = UUID('44444444-4444-4444-8444-444444444444')
          TEC = UUID('55555555-5555-4555-8555-555555555555')
          AREA = UUID('11111111-1111-4111-8111-111111111111')
          TICKET = UUID('88888888-8888-4888-8888-888888888888')
          INICIAL = UUID('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa')
          port = os.environ['CI_PG_PORT']
          engine = create_engine(
              'postgresql+psycopg://soporte_ti_api:api_ci_temporal'
              f'@127.0.0.1:{port}/grocio_ci', pool_pre_ping=True,
          )
          usuario = {'id': TEC, 'rol': 'PRACTICANTE', 'area_id': AREA}

          def identidad_ci():
              return SimpleNamespace(**usuario)

          def db_ci():
              with Session(engine) as sesion:
                  yield sesion

          app.dependency_overrides[get_current_user] = identidad_ci
          app.dependency_overrides[get_db] = db_ci
          cliente = TestClient(app, raise_server_exceptions=False)

          resumen = {'resumen_cierre': 'Se valido el funcionamiento completo del equipo y su conectividad.'}
          base_intervencion = {
              'diagnostico': 'Nueva averia en componente',
              'acciones_realizadas': 'Verificacion de hardware y pruebas',
              'duracion_minutos': 25,
              'solucion_aplicada': None,
              'es_solucion_final': False,
          }

          def rol(uid, nombre):
              usuario.update(id=uid, rol=nombre)

          def cerrar(ticket=TICKET):
              return cliente.post(f'/api/v4/incidencias/{ticket}/cerrar', json=resumen)

          def intervenir(payload):
              return cliente.post(f'/api/v4/incidencias/{TICKET}/intervenciones', json=payload)

          def comprobar(respuesta, codigo, etiqueta):
              assert respuesta.status_code == codigo, (
                  f'{etiqueta}: esperado {codigo}; '
                  f'obtenido {respuesta.status_code}: {respuesta.text[:600]}'
              )
              print(f'OK: {etiqueta}')

          def consultar(query, **values):
              with engine.connect() as conn:
                  return conn.execute(text(query),values).mappings().all()

          def postgres(sql):
              r = subprocess.run([
                  'docker','exec','-i','grocio-cierre-v4-ci',
                  'psql','-X','-U','postgres','-d','grocio_ci','-v','ON_ERROR_STOP=1'
              ], input=sql,text=True,capture_output=True)
              assert r.returncode == 0, (r.stdout, r.stderr)

          try:
              comprobar(cerrar(), 503, 'Base V3 sin habilitar cierre V4')
              postgres(open('database/03_reapertura_v4.sql',encoding='utf-8').read())
              comprobar(cerrar(INICIAL), 409, 'Ciclo 1 usa cierre original')
              comprobar(cerrar(), 409, 'No cerrar incidencia ya cerrada')

              rol(REP, 'REPRESENTANTE')
              resp = cliente.post(
                  f'/api/v4/incidencias/{TICKET}/verificaciones',
                  json={'resultado':'Observación','observaciones':'La falla persiste tras el cierre'},
              )
              comprobar(resp, 201, 'Representante reabre ciclo 2')
              assert resp.json()['ciclo_actual'] == 2
              comprobar(cerrar(), 403, 'Representante no puede cerrar')
              rol(TEC, 'PRACTICANTE')
              comprobar(cerrar(), 409, 'No cerrar sin asignacion nueva')

              rol(JEFE, 'JEFE')
              asignada = cliente.post(
                  f'/api/v4/incidencias/{TICKET}/asignar',
                  json={'tecnico_id':str(TEC)},
              )
              comprobar(asignada, 201, 'Jefe asigna tecnico en ciclo 2')
              assert asignada.json()['ciclo_atencion'] == 2

              rol(OTRO, 'ASISTENTE')
              comprobar(cerrar(), 403, 'Tecnico no responsable rechazado')
              rol(TEC, 'PRACTICANTE')
              comprobar(cerrar(), 409, 'Solucion del ciclo 1 no sirve para cerrar ciclo 2')
              datos = consultar('''
                  SELECT ciclo_actual,estado,fecha_cierre
                  FROM public.incidencias WHERE id=:ticket
              ''',ticket=TICKET)
              assert len(datos)==1 and datos[0]['ciclo_actual']==2
              assert datos[0]['estado']=='En revisión' and datos[0]['fecha_cierre'] is None

              provisional = intervenir(base_intervencion)
              comprobar(provisional, 201, 'Intervencion preliminar del ciclo 2')
              comprobar(cerrar(), 409, 'Una intervencion no final no permite cierre')

              final = intervenir({
                  **base_intervencion,
                  'solucion_aplicada':'Se reemplazo componente y se comprobo operacion estable',
                  'es_solucion_final': True,
              })
              comprobar(final, 201, 'Solucion final propia del ciclo 2')
              final_id = final.json()['id']
              assert final.json()['ciclo_atencion']==2

              # Simula un error en el historial durante el cierre.
              # Debe revertir tambien estado y fecha_fin de la asignacion.
              postgres('''
                  CREATE FUNCTION public.ci_error_cierre_v4()
                  RETURNS trigger LANGUAGE plpgsql AS $$
                  BEGIN
                    IF NEW.accion = 'CIERRE' AND NEW.ciclo_atencion = 2 THEN
                      RAISE EXCEPTION 'error de historial intencional en CI';
                    END IF;
                    RETURN NEW;
                  END;
                  $$;
                  CREATE TRIGGER ci_error_cierre_v4
                  BEFORE INSERT ON public.historial_incidencias
                  FOR EACH ROW EXECUTE FUNCTION public.ci_error_cierre_v4();
              ''')
              comprobar(cerrar(), 500, 'Error de historial detectado')
              intacto = consultar('''
                  SELECT i.estado,i.fecha_cierre,i.ciclo_actual,a.fecha_fin
                  FROM public.incidencias i
                  JOIN public.asignaciones a ON a.incidencia_id=i.id
                  WHERE i.id=:ticket AND a.ciclo_atencion=2
              ''',ticket=TICKET)[0]
              assert intacto['estado']=='En revisión'
              assert intacto['fecha_cierre'] is None
              assert intacto['fecha_fin'] is None
              assert intacto['ciclo_actual']==2
              print('OK: Rollback completo tras fallo de historial')
              postgres('''
                  DROP TRIGGER ci_error_cierre_v4 ON public.historial_incidencias;
                  DROP FUNCTION public.ci_error_cierre_v4();
              ''')

              cierre = cerrar()
              comprobar(cierre, 200, 'Cierre correcto del ciclo 2')
              assert cierre.json()['ciclo_atencion']==2
              assert cierre.json()['intervencion_final_id']==final_id
              assert cierre.json()['estado']=='Cerrado'

              actual = consultar('''
                  SELECT estado,ciclo_actual,fecha_cierre,cerrado_por_usuario_id
                  FROM public.incidencias WHERE id=:ticket
              ''',ticket=TICKET)[0]
              assert actual['estado']=='Cerrado'
              assert actual['ciclo_actual']==2 and actual['fecha_cierre'] is not None
              assert actual['cerrado_por_usuario_id']==TEC
              print('OK: Cierre y usuario guardados en PostgreSQL')

              asignaciones = consultar('''
                  SELECT tecnico_id,ciclo_atencion,fecha_fin
                  FROM public.asignaciones
                  WHERE incidencia_id=:ticket ORDER BY ciclo_atencion
              ''',ticket=TICKET)
              assert len(asignaciones)==2
              assert [a['ciclo_atencion'] for a in asignaciones]==[1,2]
              assert all(a['fecha_fin'] is not None for a in asignaciones)
              print('OK: Ciclo 1 conservado y asignacion del ciclo 2 finalizada')

              intervenciones = consultar('''
                  SELECT ciclo_atencion,diagnostico,solucion_aplicada,es_solucion_final
                  FROM public.intervenciones
                  WHERE incidencia_id=:ticket
                  ORDER BY ciclo_atencion,fecha_registro,id
              ''',ticket=TICKET)
              assert len(intervenciones)==3, intervenciones
              assert [x['ciclo_atencion'] for x in intervenciones]==[1,2,2]
              assert intervenciones[0]['solucion_aplicada']=='Solucion ANTIGUA ciclo 1'
              assert intervenciones[2]['es_solucion_final'] is True
              print('OK: Las soluciones de ambos ciclos siguen independientes')

              eventos = consultar('''
                  SELECT accion,ciclo_atencion
                  FROM public.historial_incidencias
                  WHERE incidencia_id=:ticket AND accion='CIERRE'
                  ORDER BY ciclo_atencion
              ''',ticket=TICKET)
              assert len(eventos)==2 and [x['ciclo_atencion'] for x in eventos]==[1,2]
              print('OK: Historial de ambos cierres conservado')

              comprobar(cerrar(), 409, 'Cierre duplicado bloqueado')
              comprobar(intervenir(base_intervencion), 409, 'No intervenir un ticket ya cerrado')

              rol(REP, 'REPRESENTANTE')
              conformidad = cliente.post(
                  f'/api/v4/incidencias/{TICKET}/verificaciones',
                  json={'resultado':'Conformidad'},
              )
              comprobar(conformidad, 201, 'Representante verifica cierre del ciclo 2')
              assert conformidad.json()['ciclo_actual']==2
              assert conformidad.json()['estado_actual']=='Cerrado'
              print('PASO 109D8C APROBADO: SOLO POSTGRESQL TEMPORAL')
          finally:
              app.dependency_overrides.clear()
              engine.dispose()
          PY
