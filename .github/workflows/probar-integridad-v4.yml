
name: Probar integridad historica V4

on:
  push:
    branches:
      - ajustes-docente-v4
    paths:
      - "database/03_reapertura_v4.sql"
      - ".github/workflows/probar-integridad-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-historial:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Paso 109C3 - Validar historial y rollback
        shell: bash
        run: |
          set -euo pipefail
          CONTENEDOR="grocio-v4-integridad-ci"

          docker run --detach --rm \
            --name "$CONTENEDOR" \
            -e POSTGRES_PASSWORD=clave_ficticia_ci \
            -e POSTGRES_DB=grocio_ci \
            -v "$GITHUB_WORKSPACE/database:/sql:ro" \
            postgres:16 >/dev/null

          trap 'docker rm -f "$CONTENEDOR" >/dev/null 2>&1 || true' EXIT

          listo=0
          for intento in {1..30}; do
            if docker exec "$CONTENEDOR" \
              pg_isready -U postgres -d grocio_ci >/dev/null 2>&1; then
              listo=1
              break
            fi
            sleep 2
          done
          test "$listo" -eq 1

          # Dependencias ficticias: NO es Supabase real.
          docker exec -i "$CONTENEDOR" \
            psql -U postgres -d grocio_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id UUID PRIMARY KEY);
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE soporte_ti_api LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT;
          SQL

          docker exec "$CONTENEDOR" \
            psql -U postgres -d grocio_ci -v ON_ERROR_STOP=1 \
            -f /sql/01_esquema_mvp.sql
          docker exec "$CONTENEDOR" \
            psql -U postgres -d grocio_ci -v ON_ERROR_STOP=1 \
            -f /sql/02_permisos_backend.sql

          # Sembrar registros V3 ANTES de migrar.
          docker exec -i "$CONTENEDOR" \
            psql -U postgres -d grocio_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.areas(id, nombre)
          VALUES ('11111111-1111-4111-8111-111111111111', 'Area ficticia V4');

          INSERT INTO auth.users(id) VALUES
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333');

          INSERT INTO public.usuarios(id, area_id, nombre_completo, usuario, rol)
          VALUES
            ('22222222-2222-4222-8222-222222222222',
             '11111111-1111-4111-8111-111111111111',
             'Tecnico de prueba', 'tecnico_v4_ci', 'JEFE'),
            ('33333333-3333-4333-8333-333333333333',
             '11111111-1111-4111-8111-111111111111',
             'Representante de prueba', 'rep_v4_ci', 'REPRESENTANTE');

          INSERT INTO public.incidencias(
            id, area_id, reportante_id, asunto, descripcion,
            estado, fecha_cierre, cerrado_por_usuario_id
          ) VALUES (
            '44444444-4444-4444-8444-444444444444',
            '11111111-1111-4111-8111-111111111111',
            '33333333-3333-4333-8333-333333333333',
            'Impresora ficticia', 'Caso historico de prueba',
            'Cerrado', now(), '22222222-2222-4222-8222-222222222222'
          );

          INSERT INTO public.asignaciones(
            id, incidencia_id, tecnico_id, asignado_por_id,
            origen_asignacion, fecha_asignacion, fecha_fin
          ) VALUES (
            '55555555-5555-4555-8555-555555555555',
            '44444444-4444-4444-8444-444444444444',
            '22222222-2222-4222-8222-222222222222',
            '22222222-2222-4222-8222-222222222222',
            'JEFATURA', now() - interval '2 hours', now() - interval '1 hour'
          );

          INSERT INTO public.intervenciones(
            id, incidencia_id, tecnico_id, diagnostico,
            acciones_realizadas, es_solucion_final, solucion_aplicada
          ) VALUES (
            '66666666-6666-4666-8666-666666666666',
            '44444444-4444-4444-8444-444444444444',
            '22222222-2222-4222-8222-222222222222',
            'Diagnostico historico', 'Reparacion historica',
            true, 'Solucion del ciclo original'
          );

          INSERT INTO public.verificaciones(
            id, incidencia_id, usuario_id, resultado, observaciones
          ) VALUES (
            '77777777-7777-4777-8777-777777777777',
            '44444444-4444-4444-8444-444444444444',
            '33333333-3333-4333-8333-333333333333',
            'Observación', 'Falta verificar la reparacion'
          );

          INSERT INTO public.evidencias(
            id, incidencia_id, usuario_id, nombre_archivo,
            tipo_archivo, tamano_bytes, ruta_archivo
          ) VALUES (
            '88888888-8888-4888-8888-888888888888',
            '44444444-4444-4444-8444-444444444444',
            '33333333-3333-4333-8333-333333333333',
            'evidencia-ficticia.pdf', 'application/pdf', 1234,
            'ci/ruta-ficticia.pdf'
          );

          INSERT INTO public.historial_incidencias(
            id, incidencia_id, usuario_id, accion, descripcion
          ) VALUES (
            '99999999-9999-4999-8999-999999999999',
            '44444444-4444-4444-8444-444444444444',
            '22222222-2222-4222-8222-222222222222',
            'CIERRE', 'Cierre del ciclo original'
          );
          SQL

          # Aplicar V4 SOLO en este contenedor efimero.
          docker exec "$CONTENEDOR" \
            psql -U postgres -d grocio_ci -v ON_ERROR_STOP=1 \
            -f /sql/03_reapertura_v4.sql

          docker exec -i "$CONTENEDOR" \
            psql -U postgres -d grocio_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            ticket UUID := '44444444-4444-4444-8444-444444444444';
            representante UUID := '33333333-3333-4333-8333-333333333333';
            tecnico UUID := '22222222-2222-4222-8222-222222222222';
            tabla TEXT;
            campo TEXT;
            total INTEGER;
            mensaje TEXT;
          BEGIN
            -- Comprobar columnas de los seis objetos.
            FOREACH tabla IN ARRAY ARRAY[
              'incidencias', 'asignaciones', 'intervenciones',
              'verificaciones', 'evidencias', 'historial_incidencias'
            ] LOOP
              campo := CASE WHEN tabla = 'incidencias'
                            THEN 'ciclo_actual' ELSE 'ciclo_atencion' END;
              SELECT count(*) INTO total
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = tabla
                AND column_name = campo
                AND is_nullable = 'NO'
                AND column_default IS NOT NULL;
              IF total <> 1 THEN
                RAISE EXCEPTION 'Columna V4 incorrecta: %.%', tabla, campo;
              END IF;
            END LOOP;

            -- Todos los registros originales deben existir.
            IF (SELECT count(*) FROM public.incidencias
                WHERE id = ticket AND ciclo_actual = 1) <> 1 OR
               (SELECT count(*) FROM public.asignaciones
                WHERE id = '55555555-5555-4555-8555-555555555555'
                  AND ciclo_atencion = 1) <> 1 OR
               (SELECT count(*) FROM public.intervenciones
                WHERE id = '66666666-6666-4666-8666-666666666666'
                  AND ciclo_atencion = 1
                  AND solucion_aplicada = 'Solucion del ciclo original') <> 1 OR
               (SELECT count(*) FROM public.verificaciones
                WHERE id = '77777777-7777-4777-8777-777777777777'
                  AND ciclo_atencion = 1
                  AND resultado = 'Observación') <> 1 OR
               (SELECT count(*) FROM public.evidencias
                WHERE id = '88888888-8888-4888-8888-888888888888'
                  AND ciclo_atencion = 1) <> 1 OR
               (SELECT count(*) FROM public.historial_incidencias
                WHERE id = '99999999-9999-4999-8999-999999999999'
                  AND ciclo_atencion = 1) <> 1 THEN
              RAISE EXCEPTION 'Migracion altero registros historicos';
            END IF;

            -- Simular un nuevo ciclo SOLO en CI.
            UPDATE public.incidencias
            SET ciclo_actual = 2, estado = 'En revisión',
                fecha_cierre = NULL, cerrado_por_usuario_id = NULL
            WHERE id = ticket;

            UPDATE public.incidencias
            SET estado = 'Cerrado', fecha_cierre = now(),
                cerrado_por_usuario_id = tecnico
            WHERE id = ticket;

            INSERT INTO public.verificaciones(
              incidencia_id, usuario_id, resultado, ciclo_atencion
            ) VALUES (ticket, representante, 'Conformidad', 2);

            -- Rechazar una segunda evaluacion del mismo ciclo.
            BEGIN
              INSERT INTO public.verificaciones(
                incidencia_id, usuario_id, resultado, ciclo_atencion
              ) VALUES (ticket, representante, 'Conformidad', 2);
              RAISE EXCEPTION 'Se acepto duplicado de ciclo 2';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;

            -- Rechazar ciclo cero.
            BEGIN
              UPDATE public.incidencias SET ciclo_actual = 0 WHERE id = ticket;
              RAISE EXCEPTION 'Se acepto ciclo cero';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;

            -- Comprobar rollback sin dejar eventos parciales.
            BEGIN
              INSERT INTO public.historial_incidencias(
                incidencia_id, usuario_id, accion, descripcion, ciclo_atencion
              ) VALUES (ticket, tecnico, 'SIMULACION_ROLLBACK', 'Temporal', 2);
              RAISE EXCEPTION 'ERROR_SIMULADO';
            EXCEPTION WHEN raise_exception THEN
              GET STACKED DIAGNOSTICS mensaje = MESSAGE_TEXT;
              IF mensaje <> 'ERROR_SIMULADO' THEN
                RAISE;
              END IF;
            END;

            IF EXISTS (SELECT 1 FROM public.historial_incidencias
                       WHERE accion = 'SIMULACION_ROLLBACK') THEN
              RAISE EXCEPTION 'No hubo rollback';
            END IF;

            IF (SELECT count(*) FROM public.verificaciones
                WHERE incidencia_id = ticket) <> 2 THEN
              RAISE EXCEPTION 'No se conservaron ambas evaluaciones';
            END IF;

            IF (SELECT count(*) FROM pg_class
                WHERE oid = 'public.incidencias'::regclass
                  AND relrowsecurity = true) <> 1 OR
               NOT has_table_privilege(
                 'soporte_ti_api', 'public.verificaciones', 'INSERT') THEN
              RAISE EXCEPTION 'Seguridad V3 alterada';
            END IF;

            RAISE NOTICE 'Integridad historica y rollback V4: OK';
          END;
          $$;
          SQL

          echo "Paso 109C3 verde: registros historicos conservados"
