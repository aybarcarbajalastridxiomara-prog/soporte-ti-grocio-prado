                  )
                  assert eventos[0].accion == "REASIGNACION"
                  assert eventos[0].usuario_id == jefe_id
                  assert str(anterior_id) in eventos[0].descripcion
                  assert str(nuevo_id) in eventos[0].descripcion

              print("Pruebas de reasignacion: OK")

          finally:
              api.dependency_overrides.clear()
