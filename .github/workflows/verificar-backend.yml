                  # Incidencia inexistente.
                  probar(
                      cliente,
                      "ASISTENTE",
                      BaseDatosSimulada(existe=False),
                      404,
                  )

                  # Incidencia cerrada.
                  probar(
                      cliente,
                      "PRACTICANTE",
                      BaseDatosSimulada(estado="Cerrado"),
                      409,
