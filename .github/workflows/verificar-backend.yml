              intervencion("Falla de controlador"),
              intervencion("Error de configuracion"),
          ]

          class BaseDatosSimulada:
              def __init__(self):
                  self.consulta = None

              def get(self, modelo, identificador):
                  if modelo is Incidencia:
                      if identificador == ticket_id:
                          return ticket
                  return None

              def scalars(self, consulta):
                  self.consulta = consulta
                  return SimpleNamespace(
                      all=lambda: eventos
                  )

          db = BaseDatosSimulada()
          ruta = f"/api/incidencias/{ticket_id}/intervenciones"

