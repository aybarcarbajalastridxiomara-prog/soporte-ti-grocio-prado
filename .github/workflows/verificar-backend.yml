                  fecha_registro=fecha,
              )

          class BaseDatosSimulada:
              def __init__(
                  self,
                  existe=True,
                  participo=True,
                  con_intervenciones=True,
              ):
                  self.existe = existe
                  self.participo = participo
                  self.intervenciones = (
                      [
                          crear_intervencion(30),
                          crear_intervencion(45),
                      ]
                      if con_intervenciones else []
                  )
                  self.consulta_intervenciones = None

              def get(self, modelo, identificador):
                  if modelo is Incidencia:
                      if identificador == ticket_id and self.existe:
                          return ticket
                  return None

              def scalar(self, consulta):
                  parametros = consulta.compile().params
                  assert ticket_id in parametros.values()
                  assert tecnico_id in parametros.values()

                  return uuid4() if self.participo else None

              def scalars(self, consulta):
                  self.consulta_intervenciones = consulta
                  return SimpleNamespace(
                      all=lambda: self.intervenciones
                  )

