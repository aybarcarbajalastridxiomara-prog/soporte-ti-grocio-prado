                      "VISITANTE",
                      BaseDatosSimulada(),
                      403,
                  )

                  # Incidencia inexistente.
                  probar(
                      cliente,
                      "JEFE",
                      BaseDatosSimulada(existe=False),
                      404,
                  )

                  # Tecnico que no participo en el ticket.
                  probar(
                      cliente,
                      "ASISTENTE",
                      BaseDatosSimulada(participo=False),
                      403,
                  )

                  # Sin intervenciones no hay borrador.
