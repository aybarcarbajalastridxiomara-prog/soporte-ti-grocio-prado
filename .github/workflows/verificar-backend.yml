              hora_inicio_problema=time(8, 30),
              estado="En revisión",
              prioridad="Media",
              fecha_registro=fecha,
              fecha_cierre=None,
          )

          def crear_intervencion(minutos):
              return SimpleNamespace(
                  id=uuid4(),
                  tecnico_id=tecnico_id,
                  diagnostico="Problema del controlador",
                  acciones_realizadas="Revision del equipo",
                  duracion_minutos=minutos,
