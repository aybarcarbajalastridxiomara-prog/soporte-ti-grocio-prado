                  self.registros = []
                  self.confirmado = False

              def scalar(self, consulta):
                  entidad = consulta.column_descriptions[0][
                      "entity"
                  ]

                  if entidad is Incidencia:
                      return self.ticket

                  if entidad is Asignacion:
                      return self.asignacion

                  if entidad is Intervencion:
                      return self.ultima

                  raise AssertionError("Consulta inesperada")

              def add(self, objeto):
                  self.registros.append(objeto)

              def flush(self):
                  pass

              def commit(self):
                  self.confirmado = True

              def rollback(self):
                  self.confirmado = False

          ruta = f"/api/incidencias/{ticket_id}/cerrar"

          def probar(cliente, rol, db, esperado, cuerpo=None):
              api.dependency_overrides[get_current_user] = (
                  lambda: SimpleNamespace(
                      id=tecnico_id,
                      rol=rol,
                  )
              )
              api.dependency_overrides[get_db] = lambda: db

              respuesta = cliente.post(
                  ruta,
                  json=datos if cuerpo is None else cuerpo,
              )

              assert respuesta.status_code == esperado, (
                  respuesta.text
              )

              return respuesta

          try:
              with TestClient(api) as cliente:

                  # Sin iniciar sesion.
                  respuesta = cliente.post(ruta, json=datos)
                  assert respuesta.status_code == 401

                  # Solo asistente o practicante.
                  for rol in ("JEFE", "REPRESENTANTE"):
                      probar(
                          cliente, rol,
                          BaseDatosSimulada(), 403,
                      )

                  # Incidencia inexistente.
                  probar(
                      cliente, "ASISTENTE",
                      BaseDatosSimulada(existe=False), 404,
                  )

                  # Incidencia ya cerrada.
                  probar(
                      cliente, "ASISTENTE",
                      BaseDatosSimulada(estado="Cerrado"), 409,
                  )

                  # Incidencia aun pendiente.
                  probar(
                      cliente, "PRACTICANTE",
                      BaseDatosSimulada(estado="Pendiente"), 409,
                  )

                  # Sin responsable.
                  probar(
                      cliente, "ASISTENTE",
                      BaseDatosSimulada(asignada=False), 409,
                  )

                  # Responsable diferente.
                  probar(
                      cliente, "ASISTENTE",
                      BaseDatosSimulada(
                          responsable_id=uuid4()
                      ), 403,
                  )

                  # Sin intervencion tecnica.
                  probar(
                      cliente, "ASISTENTE",
                      BaseDatosSimulada(
                          hay_intervencion=False
                      ), 409,
                  )

                  # Intervencion sin solucion final.
                  probar(
                      cliente, "ASISTENTE",
                      BaseDatosSimulada(
                          solucion_final=False
                      ), 409,
                  )

                  # Solucion final sin descripcion.
                  probar(
                      cliente, "ASISTENTE",
                      BaseDatosSimulada(
                          solucion="   "
                      ), 409,
                  )

                  # Resumen de cierre demasiado corto.
                  probar(
                      cliente, "ASISTENTE",
                      BaseDatosSimulada(), 422,
                      {"resumen_cierre": "Listo"},
                  )

                  # Cierre correcto por ambos perfiles.
                  for rol in ("ASISTENTE", "PRACTICANTE"):
                      db = BaseDatosSimulada()

                      respuesta = probar(
                          cliente, rol, db, 200
                      )

                      resultado = respuesta.json()

                      assert resultado["incidencia_id"] == str(
                          ticket_id
                      )
                      assert resultado["estado"] == "Cerrado"
                      assert resultado["cerrado_por_usuario_id"] == str(
                          tecnico_id
                      )

                      assert db.confirmado is True
                      assert db.ticket.estado == "Cerrado"
                      assert db.ticket.fecha_cierre is not None
                      assert db.ticket.cerrado_por_usuario_id == (
                          tecnico_id
                      )
                      assert db.asignacion.fecha_fin == (
                          db.ticket.fecha_cierre
                      )

                      historial = [
                          x for x in db.registros
                          if isinstance(x, HistorialIncidencia)
                      ]

                      assert len(historial) == 1
                      assert historial[0].accion == "CIERRE"
                      assert historial[0].usuario_id == tecnico_id
                      assert "Resumen:" in historial[0].descripcion

                      # No se permite cerrar nuevamente.
                      respuesta = probar(
                          cliente, rol, db, 409
                      )
                      assert db.ticket.estado == "Cerrado"
                      assert len(db.registros) == 1

              print("Pruebas de cierre de incidencias: OK")

          finally:
              api.dependency_overrides.clear()
          PY


          
      - name: Probar conformidad y observaciones
        working-directory: backend
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from types import SimpleNamespace
          from uuid import uuid4

          from fastapi.testclient import TestClient

          from app.main import app as api
          from app.auth import get_current_user
          from app.db import get_db
          from app.models import (
              Incidencia,
              Verificacion,
              HistorialIncidencia,
          )

          ticket_id = uuid4()
          usuario_id = uuid4()
          area_id = uuid4()

          class BaseDatosSimulada:
              def __init__(
                  self,
                  existe=True,
                  estado="Cerrado",
                  area_ticket=None,
              ):
                  self.ticket = (
                      SimpleNamespace(
                          id=ticket_id,
                          area_id=area_ticket or area_id,
                          estado=estado,
                      )
                      if existe else None
                  )
                  self.registros = []
                  self.confirmado = False

              def scalar(self, consulta):
                  entidad = consulta.column_descriptions[0][
                      "entity"
                  ]

                  assert entidad is Incidencia
                  assert ticket_id in (
                      consulta.compile().params.values()
                  )

                  return self.ticket

              def add(self, objeto):
                  self.registros.append(objeto)

              def flush(self):
                  for objeto in self.registros:
                      if isinstance(objeto, Verificacion):
                          if objeto.id is None:
                              objeto.id = uuid4()

                          if objeto.fecha_verificacion is None:
                              objeto.fecha_verificacion = (
                                  datetime.now(timezone.utc)
                              )

              def commit(self):
                  self.confirmado = True

              def rollback(self):
                  self.confirmado = False

          ruta = (
              f"/api/incidencias/{ticket_id}/verificaciones"
          )

          conformidad = {
              "resultado": "Conformidad",
              "observaciones": "El equipo funciona correctamente.",
          }

          observacion = {
              "resultado": "Observación",
              "observaciones": (
                  "La impresora sigue presentando fallas."
              ),
          }

          def probar(
              cliente, rol, db, datos, esperado,
              area_usuario=area_id,
          ):
              api.dependency_overrides[get_current_user] = (
                  lambda: SimpleNamespace(
                      id=usuario_id,
                      rol=rol,
                      area_id=area_usuario,
                  )
              )

              api.dependency_overrides[get_db] = lambda: db

              respuesta = cliente.post(
                  ruta,
                  json=datos,
              )

              assert respuesta.status_code == esperado, (
                  respuesta.text
              )

              return respuesta

          try:
              with TestClient(api) as cliente:

                  # No autenticado.
                  respuesta = cliente.post(
                      ruta, json=conformidad
                  )
                  assert respuesta.status_code == 401

                  # Solo el representante registra evaluaciones.
                  for rol in (
                      "JEFE",
                      "ASISTENTE",
                      "PRACTICANTE",
                  ):
                      probar(
                          cliente, rol,
                          BaseDatosSimulada(),
                          conformidad, 403,
                      )

                  # Incidencia inexistente.
                  probar(
                      cliente, "REPRESENTANTE",
                      BaseDatosSimulada(existe=False),
                      conformidad, 404,
                  )

                  # Representante de otra area.
                  probar(
                      cliente, "REPRESENTANTE",
                      BaseDatosSimulada(),
                      observacion, 404,
                      area_usuario=uuid4(),
                  )

                  # Incidencia aun abierta.
                  probar(
                      cliente, "REPRESENTANTE",
                      BaseDatosSimulada(
                          estado="En revisión"
                      ),
                      conformidad, 409,
                  )

                  # Observacion sin descripcion.
                  probar(
                      cliente, "REPRESENTANTE",
                      BaseDatosSimulada(),
                      {
                          "resultado": "Observación",
                          "observaciones": "",
                      },
                      422,
                  )

                  # Resultado no permitido.
                  probar(
                      cliente, "REPRESENTANTE",
                      BaseDatosSimulada(),
                      {
                          "resultado": "Pendiente",
                          "observaciones": "Comentario",
                      },
                      422,
                  )

                  # Registrar conformidad y observacion.
                  casos = [
                      (conformidad, "CONFORMIDAD"),
                      (observacion, "OBSERVACION"),
                  ]

                  for datos, accion in casos:
                      db = BaseDatosSimulada()

                      respuesta = probar(
                          cliente,
                          "REPRESENTANTE",
                          db,
                          datos,
                          201,
                      )

                      resultado = respuesta.json()

                      assert resultado["incidencia_id"] == str(
                          ticket_id
                      )
                      assert resultado["usuario_id"] == str(
                          usuario_id
                      )
                      assert resultado["resultado"] == (
                          datos["resultado"]
                      )

                      verificaciones = [
                          x for x in db.registros
                          if isinstance(x, Verificacion)
                      ]

                      historial = [
                          x for x in db.registros
                          if isinstance(x, HistorialIncidencia)
                      ]

                      assert len(verificaciones) == 1
                      assert len(historial) == 1
                      assert db.confirmado is True

                      assert historial[0].accion == accion
                      assert historial[0].usuario_id == (
                          usuario_id
                      )
                      assert historial[0].incidencia_id == (
                          ticket_id
                      )

                      # La evaluacion no reabre el ticket.
                      assert db.ticket.estado == "Cerrado"

              print("Pruebas de conformidad y observaciones: OK")

          finally:
              api.dependency_overrides.clear()
          PY


          
      - name: Probar consulta de verificaciones
        working-directory: backend
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from types import SimpleNamespace
          from uuid import uuid4

          from fastapi.testclient import TestClient

          from app.main import app as api
          from app.auth import get_current_user
          from app.db import get_db
          from app.models import Incidencia, Verificacion

          ticket_id = uuid4()
          area_tesoreria = uuid4()
          area_logistica = uuid4()
          fecha = datetime(2026, 11, 5, tzinfo=timezone.utc)

          def crear_evaluacion(resultado, detalle, fecha_registro):
              return SimpleNamespace(
                  id=uuid4(),
                  incidencia_id=ticket_id,
                  usuario_id=uuid4(),
                  resultado=resultado,
                  observaciones=detalle,
                  fecha_verificacion=fecha_registro,
              )

          evaluaciones = [
              crear_evaluacion(
                  "Observación",
                  "La impresora continua presentando fallas.",
                  fecha + timedelta(days=1),
              ),
              crear_evaluacion(
                  "Conformidad",
                  "Se recibio la atencion.",
                  fecha,
              ),
          ]

          class BaseDatosSimulada:
              def __init__(self, existe=True, sin_evaluaciones=False):
                  self.existe = existe
                  self.consulta = None
                  self.evaluaciones = (
                      [] if sin_evaluaciones else evaluaciones
                  )

              def get(self, modelo, identificador):
                  if (
                      modelo is Incidencia
                      and identificador == ticket_id
                      and self.existe
                  ):
                      return SimpleNamespace(
                          id=ticket_id,
                          area_id=area_tesoreria,
                          estado="Cerrado",
                      )
                  return None

              def scalars(self, consulta):
                  self.consulta = consulta
                  assert (
                      consulta.column_descriptions[0]["entity"]
                      is Verificacion
                  )
                  return SimpleNamespace(
                      all=lambda: self.evaluaciones
                  )

          ruta = f"/api/incidencias/{ticket_id}/verificaciones"

          def probar(cliente, rol, area, db, esperado):
              api.dependency_overrides[get_current_user] = (
                  lambda: SimpleNamespace(
                      id=uuid4(),
                      rol=rol,
                      area_id=area,
                  )
              )
              api.dependency_overrides[get_db] = lambda: db

              respuesta = cliente.get(ruta)
              assert respuesta.status_code == esperado, (
                  respuesta.text
              )
              return respuesta

          try:
              with TestClient(api) as cliente:

                  # Sin autenticacion.
                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 401

                  # Representante consulta su propia area.
                  db = BaseDatosSimulada()
                  respuesta = probar(
                      cliente,
                      "REPRESENTANTE",
                      area_tesoreria,
                      db,
                      200,
                  )

                  datos = respuesta.json()
                  assert len(datos) == 2

                  # La evaluacion mas reciente aparece primero.
                  assert datos[0]["resultado"] == "Observación"
                  assert datos[1]["resultado"] == "Conformidad"
                  assert (
                      datos[0]["fecha_verificacion"]
                      > datos[1]["fecha_verificacion"]
                  )

                  # La consulta SQL filtra por la incidencia.
                  parametros = db.consulta.compile().params
                  assert ticket_id in parametros.values()

                  # La consulta SQL solicita orden descendente.
                  sql = str(db.consulta).upper()
                  assert "ORDER BY" in sql
                  assert "FECHA_VERIFICACION DESC" in sql

                  # Representante de otra area.
                  probar(
                      cliente,
                      "REPRESENTANTE",
                      area_logistica,
                      BaseDatosSimulada(),
                      404,
                  )

                  # Jefe, asistente y practicante.
                  for rol in ("JEFE", "ASISTENTE", "PRACTICANTE"):
                      respuesta = probar(
                          cliente,
                          rol,
                          area_logistica,
                          BaseDatosSimulada(),
                          200,
                      )
                      assert len(respuesta.json()) == 2

                  # Incidencia inexistente.
                  probar(
                      cliente,
                      "JEFE",
                      area_tesoreria,
                      BaseDatosSimulada(existe=False),
                      404,
                  )

                  # Incidencia sin evaluaciones.
                  respuesta = probar(
                      cliente,
                      "JEFE",
                      area_tesoreria,
                      BaseDatosSimulada(sin_evaluaciones=True),
                      200,
                  )
                  assert respuesta.json() == []

                  # Rol no autorizado.
                  probar(
                      cliente,
                      "VISITANTE",
                      area_tesoreria,
                      BaseDatosSimulada(),
                      403,
                  )

                  # Identificador invalido.
                  respuesta = cliente.get(
                      "/api/incidencias/no-es-uuid/verificaciones"
                  )
                  assert respuesta.status_code == 422

              print("Consulta de verificaciones: OK")

          finally:
              api.dependency_overrides.clear()
          PY





