                      )
                      assert historial[0].accion == (
                          "INTERVENCION"
                      )
                      assert historial[0].usuario_id == (
                          tecnico_id
                      )

                      # La atencion no debe cerrar el ticket.
                      assert db.ticket.estado == "En revisión"

              print("Pruebas de atencion tecnica: OK")

