              "es_solucion_final": True,
          }

          class BaseDatosSimulada:
              def __init__(
                  self,
                  estado="En revisión",
                  existe=True,
                  asignada=True,
                  responsable_id=None,
              ):
                  self.ticket = (
                      SimpleNamespace(
                          id=ticket_id,
                          estado=estado,
                      )
                      if existe else None
                  )

                  self.asignacion = (
