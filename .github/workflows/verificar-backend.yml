                      )
                      assert resultado["incidencia_id"] == str(
                          ticket_id
                      )
                      assert resultado["duracion_minutos"] == 45
                      assert resultado["es_solucion_final"] is True
                      assert db.confirmado is True

                      intervenciones = [
                          x for x in db.registros
                          if isinstance(x, Intervencion)
                      ]

                      historial = [
                          x for x in db.registros
                          if isinstance(x, HistorialIncidencia)
                      ]

                      assert len(intervenciones) == 1
                      assert len(historial) == 1

                      assert intervenciones[0].tecnico_id == (
