              )

              assert respuesta.status_code == esperado, (
                  respuesta.text
              )

              return respuesta

          try:
              with TestClient(api) as cliente:

                  # Sin iniciar sesion.
                  respuesta = cliente.post(
                      ruta,
                      json=datos,
                  )
                  assert respuesta.status_code == 401

                  # Jefe y representante no registran
                  # intervenciones mediante este endpoint.
                  for rol in ("JEFE", "REPRESENTANTE"):
                      probar(
                          cliente,
                          rol,
                          BaseDatosSimulada(),
                          403,
                      )

                  # Incidencia inexistente.
                  probar(
                      cliente,
                      "ASISTENTE",
                      BaseDatosSimulada(existe=False),
                      404,
                  )

                  # Incidencia cerrada.
                  probar(
                      cliente,
                      "PRACTICANTE",
                      BaseDatosSimulada(estado="Cerrado"),
                      409,
                  )

                  # Incidencia pendiente de asignacion.
