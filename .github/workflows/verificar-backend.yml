
name: Verificar backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/verificar-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
   
      - name: Instalar dependencias
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "httpx>=0.28,<1.0"
          

      - name: Verificar sintaxis Python
        run: |
          python -m compileall -q backend/app

      - name: Verificar aplicacion FastAPI
        working-directory: backend
        run: |
          python - <<'PY'
          from app.main import app as api
          from app.schemas import IncidenciaCrear

          import app.auth
          import app.config
          import app.db
          import app.models
          
          rutas = set(api.openapi()["paths"])
          
          assert "/" in rutas
          assert "/api/health" in rutas     
          assert api.docs_url == "/docs"
          assert "/api/me" in rutas


          incidencia = IncidenciaCrear(
              asunto="Impresora no funciona",
              descripcion="La impresora no responde.",
              impacto="Parcialmente",
          )

          assert incidencia.reincidente is False

          print("Verificacion inicial del backend aprobada.")
          PY

      - name: Probar seguridad del perfil
        working-directory: backend
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app as api

          with TestClient(api) as cliente:
              respuesta = cliente.get("/api/me")

              assert respuesta.status_code == 401, (
                  f"Se esperaba 401, se obtuvo "
                  f"{respuesta.status_code}"
              )

              assert (
                  respuesta.headers.get("www-authenticate")
                  == "Bearer"
              )

              salud = cliente.get("/api/health")
              assert salud.status_code == 200

          print("Acceso sin sesion rechazado: OK")
          print("Endpoint de salud disponible: OK")
          PY

          
      - name: Probar permisos de incidencias
        working-directory: backend
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          from uuid import uuid4

          from fastapi.testclient import TestClient

          from app.main import app as api
          from app.auth import get_current_user
          from app.db import get_db


          class BaseDatosSimulada:
              def __init__(self):
                  self.consulta = None

              def scalars(self, consulta):
                  self.consulta = consulta
                  return SimpleNamespace(all=lambda: [])


          try:
              with TestClient(api) as cliente:

                  # 1. Sin sesion debe rechazar el acceso.
                  respuesta = cliente.get("/api/incidencias")
                  assert respuesta.status_code == 401

                  # 2. Simular representante municipal.
                  area_tesoreria = uuid4()
                  db_simulada = BaseDatosSimulada()

                  api.dependency_overrides[get_current_user] = (
                      lambda: SimpleNamespace(
                          rol="REPRESENTANTE",
                          area_id=area_tesoreria,
                      )
                  )

                  api.dependency_overrides[get_db] = (
                      lambda: db_simulada
                  )

                  respuesta = cliente.get(
                      "/api/incidencias?estado=Cerrado"
                  )

                  assert respuesta.status_code == 200
                  assert respuesta.json() == []

                  # Debe filtrar por area y estado.
                  filtro = str(db_simulada.consulta.whereclause)
                  parametros = db_simulada.consulta.compile().params

                  assert "incidencias.area_id" in filtro
                  assert "incidencias.estado" in filtro
                  assert area_tesoreria in parametros.values()
                  assert "Cerrado" in parametros.values()

                  # 3. Rechazar limites incorrectos.
                  respuesta = cliente.get(
                      "/api/incidencias?limite=101"
                  )
                  assert respuesta.status_code == 422

                  # 4. Un rol no autorizado debe ser rechazado.
                  api.dependency_overrides[get_current_user] = (
                      lambda: SimpleNamespace(
                          rol="VISITANTE",
                          area_id=area_tesoreria,
                      )
                  )

                  respuesta = cliente.get("/api/incidencias")
                  assert respuesta.status_code == 403

                  # 5. El jefe puede consultar todos los tickets.
                  api.dependency_overrides[get_current_user] = (
                      lambda: SimpleNamespace(
                          rol="JEFE",
                          area_id=area_tesoreria,
                      )
                  )

                  respuesta = cliente.get("/api/incidencias")
                  assert respuesta.status_code == 200
                  assert db_simulada.consulta.whereclause is None

              print("Pruebas de permisos de incidencias: OK")

          finally:
              api.dependency_overrides.clear()
          PY

          
      - name: Probar registro de incidencias
        working-directory: backend
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from types import SimpleNamespace
          from uuid import uuid4

          from fastapi.testclient import TestClient

          from app.main import app as api
          from app.auth import get_current_user
          from app.db import get_db
          from app.models import Incidencia, HistorialIncidencia


          class BaseDatosSimulada:
              def __init__(self):
                  self.registros = []
                  self.confirmado = False

              def add(self, objeto):
                  self.registros.append(objeto)

              def flush(self):
                  for objeto in self.registros:
                      if isinstance(objeto, Incidencia):
                          if objeto.id is None:
                              objeto.id = uuid4()
                              objeto.codigo = "INC-2026-000001"
                              objeto.fecha_registro = (
                                  datetime.now(timezone.utc)
                              )

              def get(self, modelo, identificador):
                  return None

              def commit(self):
                  self.confirmado = True

              def rollback(self):
                  self.confirmado = False


          area = uuid4()
          usuario = SimpleNamespace(
              id=uuid4(),
              area_id=area,
              rol="REPRESENTANTE",
          )

          db = BaseDatosSimulada()

          datos = {
              "asunto": "Impresora no funciona",
              "descripcion": "No imprime documentos.",
              "impacto": "Parcialmente",
              "fecha_inicio_problema": "2026-11-05",
              "hora_inicio_problema": "08:30:00",
          }

          try:
              with TestClient(api) as cliente:

                  # Sin sesion no se puede registrar.
                  respuesta = cliente.post(
                      "/api/incidencias", json=datos
                  )
                  assert respuesta.status_code == 401

                  api.dependency_overrides[get_db] = (
                      lambda: db
                  )

                  # Personal de Sistemas no registra tickets.
                  for rol in (
                      "JEFE", "ASISTENTE", "PRACTICANTE"
                  ):
                      api.dependency_overrides[
                          get_current_user
                      ] = lambda rol=rol: SimpleNamespace(
                          id=usuario.id,
                          area_id=area,
                          rol=rol,
                      )

                      respuesta = cliente.post(
                          "/api/incidencias", json=datos
                      )
                      assert respuesta.status_code == 403

                  api.dependency_overrides[
                      get_current_user
                  ] = lambda: usuario

                  # Rechazar estado y prioridad enviados.
                  modificados = {
                      **datos,
                      "estado": "Cerrado",
                      "prioridad": "Alta",
                  }

                  respuesta = cliente.post(
                      "/api/incidencias",
                      json=modificados,
                  )
                  assert respuesta.status_code == 422

                  # Reincidencia sin referencia.
                  respuesta = cliente.post(
                      "/api/incidencias",
                      json={**datos, "reincidente": True},
                  )
                  assert respuesta.status_code == 422

                  # Registro correcto.
                  respuesta = cliente.post(
                      "/api/incidencias", json=datos
                  )

                  assert respuesta.status_code == 201, (
                      respuesta.text
                  )

                  resultado = respuesta.json()

                  assert resultado["estado"] == "Pendiente"
                  assert resultado["prioridad"] is None
                  assert resultado["area_id"] == str(area)
                  assert db.confirmado is True

                  tickets = [
                      objeto for objeto in db.registros
                      if isinstance(objeto, Incidencia)
                  ]

                  historial = [
                      objeto for objeto in db.registros
                      if isinstance(objeto, HistorialIncidencia)
                  ]

                  assert len(tickets) == 1
                  assert len(historial) == 1
                  assert tickets[0].reportante_id == usuario.id
                  assert historial[0].accion == "CREACION"
                  assert historial[0].incidencia_id == tickets[0].id

              print("Pruebas de registro de incidencias: OK")

          finally:
              api.dependency_overrides.clear()
          PY

          
      - name: Probar detalle de incidencias
        working-directory: backend
        run: |
          python - <<'PY'
          from datetime import date, datetime, time, timezone
          from types import SimpleNamespace
          from uuid import uuid4

          from fastapi.testclient import TestClient

          from app.main import app as api
          from app.auth import get_current_user
          from app.db import get_db
          from app.models import Incidencia


          area_tesoreria = uuid4()
          area_logistica = uuid4()

          ticket = SimpleNamespace(
              id=uuid4(),
              codigo="INC-2026-000001",
              area_id=area_tesoreria,
              reportante_id=uuid4(),
              asunto="Impresora no funciona",
              descripcion="No imprime documentos.",
              categoria="Equipos perifericos",
              equipo_sistema_afectado="Impresora HP",
              ubicacion="Oficina de Tesoreria",
              impacto="Parcialmente",
              fecha_inicio_problema=date(2026, 11, 5),
              hora_inicio_problema=time(8, 30),
              incidencia_anterior_id=None,
              detalle_reincidencia=None,
              estado="Cerrado",
              prioridad="Media",
              fecha_registro=datetime.now(timezone.utc),
              fecha_cierre=datetime.now(timezone.utc),
              cerrado_por_usuario_id=uuid4(),
          )


          class BaseDatosSimulada:
              def get(self, modelo, identificador):
                  assert modelo is Incidencia
                  if identificador == ticket.id:
                      return ticket
                  return None


          def perfil(rol, area):
              return SimpleNamespace(
                  id=uuid4(),
                  rol=rol,
                  area_id=area,
              )


          try:
              with TestClient(api) as cliente:
                  ruta = f"/api/incidencias/{ticket.id}"

                  # Sin autenticacion: acceso denegado.
                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 401

                  api.dependency_overrides[get_db] = (
                      lambda: BaseDatosSimulada()
                  )

                  # Tesoreria consulta su ticket cerrado.
                  api.dependency_overrides[get_current_user] = (
                      lambda: perfil(
                          "REPRESENTANTE", area_tesoreria
                      )
                  )

                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 200, (
                      respuesta.text
                  )

                  datos = respuesta.json()
                  assert datos["id"] == str(ticket.id)
                  assert datos["codigo"] == ticket.codigo
                  assert datos["estado"] == "Cerrado"
                  assert datos["asunto"] == ticket.asunto

                  # Otra area no puede consultar el ticket.
                  api.dependency_overrides[get_current_user] = (
                      lambda: perfil(
                          "REPRESENTANTE", area_logistica
                      )
                  )

                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 404

                  # El jefe de Sistemas puede consultarlo.
                  api.dependency_overrides[get_current_user] = (
                      lambda: perfil("JEFE", area_logistica)
                  )

                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 200

                  # Una incidencia inexistente devuelve 404.
                  respuesta = cliente.get(
                      f"/api/incidencias/{uuid4()}"
                  )
                  assert respuesta.status_code == 404

                  # Identificadores invalidos devuelven 422.
                  respuesta = cliente.get(
                      "/api/incidencias/identificador-invalido"
                  )
                  assert respuesta.status_code == 422

                  # Un rol no autorizado es rechazado.
                  api.dependency_overrides[get_current_user] = (
                      lambda: perfil("VISITANTE", area_tesoreria)
                  )

                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 403

              print("Pruebas de detalle de incidencias: OK")

          finally:
              api.dependency_overrides.clear()
          PY

          
      - name: Probar historial de incidencias
        working-directory: backend
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from types import SimpleNamespace
          from uuid import uuid4

          from fastapi.testclient import TestClient

          from app.main import app as api
          from app.auth import get_current_user
          from app.db import get_db
          from app.models import Incidencia

          area_tesoreria = uuid4()
          area_logistica = uuid4()
          ticket_id = uuid4()

          ticket = SimpleNamespace(
              id=ticket_id,
              area_id=area_tesoreria,
              estado="Cerrado",
          )

          evento = SimpleNamespace(
              id=uuid4(),
              usuario_id=uuid4(),
              accion="CREACION",
              descripcion="Incidencia registrada.",
              fecha_registro=datetime.now(timezone.utc),
          )

          class BaseDatosSimulada:
              def __init__(self):
                  self.consulta = None

              def get(self, modelo, identificador):
                  if modelo is Incidencia:
                      if identificador == ticket_id:
                          return ticket
                  return None

              def scalars(self, consulta):
                  self.consulta = consulta
                  return SimpleNamespace(
                      all=lambda: [evento]
                  )

          db = BaseDatosSimulada()

          def perfil(rol, area):
              return SimpleNamespace(
                  id=uuid4(),
                  rol=rol,
                  area_id=area,
              )

          ruta = f"/api/incidencias/{ticket_id}/historial"

          try:
              with TestClient(api) as cliente:

                  # Usuario sin sesion.
                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 401

                  api.dependency_overrides[get_db] = (
                      lambda: db
                  )

                  # Tesoreria consulta su historial.
                  api.dependency_overrides[
                      get_current_user
                  ] = lambda: perfil(
                      "REPRESENTANTE", area_tesoreria
                  )

                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 200

                  datos = respuesta.json()
                  assert len(datos) == 1
                  assert datos[0]["accion"] == "CREACION"

                  # Verificar filtro por identificador.
                  parametros = db.consulta.compile().params
                  assert ticket_id in parametros.values()

                  # Logistica no puede ver el historial.
                  api.dependency_overrides[
                      get_current_user
                  ] = lambda: perfil(
                      "REPRESENTANTE", area_logistica
                  )

                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 404

                  # El jefe puede consultar el historial.
                  api.dependency_overrides[
                      get_current_user
                  ] = lambda: perfil(
                      "JEFE", area_logistica
                  )

                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 200

                  # Ticket inexistente.
                  respuesta = cliente.get(
                      f"/api/incidencias/{uuid4()}/historial"
                  )
                  assert respuesta.status_code == 404

                  # Rol no autorizado.
                  api.dependency_overrides[
                      get_current_user
                  ] = lambda: perfil(
                      "VISITANTE", area_tesoreria
                  )

                  respuesta = cliente.get(ruta)
                  assert respuesta.status_code == 403

              print("Pruebas de historial: OK")

          finally:
              api.dependency_overrides.clear()
          PY

