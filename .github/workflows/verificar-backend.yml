                  assert len(eventos) == 1

                  nueva = asignaciones[0]
                  assert db.anterior.tecnico_id == anterior_id
                  assert db.anterior.fecha_fin is not None
                  assert nueva.tecnico_id == nuevo_id
                  assert nueva.asignado_por_id == jefe_id
                  assert nueva.motivo_reasignacion == (
