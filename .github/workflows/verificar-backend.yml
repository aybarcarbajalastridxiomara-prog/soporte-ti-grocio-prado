      - name: Probar conflictos de PostgreSQL en verificaciones
        working-directory: backend
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          from uuid import uuid4

          from fastapi.testclient import TestClient
          from sqlalchemy.exc import IntegrityError

          from app.main import app as api
          from app.auth import get_current_user
          from app.db import get_db
          from app.models import (
              Incidencia,
              Verificacion,
              HistorialIncidencia,
          )

          ticket_id = uuid4()
          usuario_id = uuid4()
          area_id = uuid4()

          class ErrorPostgres(Exception):
              """Simula un error de integridad PostgreSQL."""

              def __init__(self, restriccion):
                  super().__init__(restriccion)
                  self.diag = SimpleNamespace(
                      constraint_name=restriccion
                  )

          class BaseDatosSimulada:
              def __init__(self, restriccion):
                  self.restriccion = restriccion
                  self.registros = []
                  self.revertido = False
                  self.confirmado = False

              def scalar(self, consulta):
                  entidad = consulta.column_descriptions[0][
                      "entity"
                  ]

                  assert ticket_id in (
                      consulta.compile().params.values()
                  )

                  if entidad is Incidencia:
                      return SimpleNamespace(
                          id=ticket_id,
                          area_id=area_id,
                          estado="Cerrado",
                      )

                  if entidad is Verificacion:
                      return None

                  raise AssertionError("Consulta inesperada")

              def add(self, objeto):
                  self.registros.append(objeto)

              def flush(self):
                  # Simular el rechazo de PostgreSQL.
                  raise IntegrityError(
                      "INSERT INTO verificaciones",
                      {},
                      ErrorPostgres(self.restriccion),
                  )

              def commit(self):
                  self.confirmado = True

              def rollback(self):
                  self.revertido = True

          ruta = (
              f"/api/incidencias/{ticket_id}/verificaciones"
          )

          datos = {
              "resultado": "Conformidad",
              "observaciones": "Atencion recibida.",
          }

          api.dependency_overrides[get_current_user] = (
              lambda: SimpleNamespace(
                  id=usuario_id,
                  rol="REPRESENTANTE",
                  area_id=area_id,
              )
          )

          try:
              with TestClient(
                  api,
                  raise_server_exceptions=False,
              ) as cliente:

                  # Error por evaluacion duplicada.
                  db = BaseDatosSimulada(
                      "ux_verificaciones_incidencia"
                  )

                  api.dependency_overrides[get_db] = (
                      lambda: db
                  )

                  respuesta = cliente.post(
                      ruta,
                      json=datos,
                  )

                  assert respuesta.status_code == 409, (
                      respuesta.text
                  )

                  assert (
                      "ya tiene una evaluacion"
                      in respuesta.json()["detail"]
                  )

                  assert db.revertido is True
                  assert db.confirmado is False

                  # La operacion falla antes del historial.
                  assert len(db.registros) == 1
                  assert isinstance(
                      db.registros[0],
                      Verificacion,
                  )
                  assert not any(
                      isinstance(x, HistorialIncidencia)
                      for x in db.registros
                  )

                  # Otro error de integridad no debe
                  # presentarse como duplicidad.
                  db_otro = BaseDatosSimulada(
                      "fk_verificaciones_usuario"
                  )

                  api.dependency_overrides[get_db] = (
                      lambda: db_otro
                  )

                  respuesta = cliente.post(
                      ruta,
                      json=datos,
                  )

                  assert respuesta.status_code == 500, (
                      respuesta.text
                  )

                  assert db_otro.revertido is True
                  assert db_otro.confirmado is False

              print(
                  "Pruebas de conflictos PostgreSQL: OK"
              )

          finally:
              api.dependency_overrides.clear()
          PY


          
      - name: Validar sintaxis y estructura del esquema SQL
        run: |
          python -m pip install "pglast>=6,<9"

          python - <<'PY'
          import re
          from pathlib import Path
          from pglast import parse_sql

          archivo = Path("database/01_esquema_mvp.sql")

          assert archivo.exists(), (
              "No se encontro el esquema SQL."
          )

          contenido = archivo.read_text(
              encoding="utf-8"
          )

          # Analizar la sintaxis con el parser de PostgreSQL.
          instrucciones = parse_sql(contenido)

          assert instrucciones, (
              "El archivo SQL no contiene instrucciones."
          )

          # Comprobar las ocho tablas del MVP.
          tablas = {
              "areas",
              "usuarios",
              "incidencias",
              "asignaciones",
              "intervenciones",
              "verificaciones",
              "evidencias",
              "historial_incidencias",
          }

          encontradas = set(
              re.findall(
                  r"\bCREATE\s+TABLE\s+public\.([a-z_]+)\s*\(",
                  contenido,
                  flags=re.IGNORECASE,
              )
          )

          assert encontradas == tablas, (
              f"Tablas faltantes: {tablas - encontradas}. "
              f"Tablas inesperadas: {encontradas - tablas}"
          )

          # Verificar RLS habilitado en cada tabla.
          for tabla in tablas:
              patron = (
                  rf"\bALTER\s+TABLE\s+public\.{tabla}"
                  rf"\s+ENABLE\s+ROW\s+LEVEL\s+SECURITY\s*;"
              )

              assert re.search(
                  patron,
                  contenido,
                  flags=re.IGNORECASE,
              ), f"Falta habilitar RLS en {tabla}"

          # Verificar el indice unico de evaluaciones.
          indice_unico = (
              r"\bCREATE\s+UNIQUE\s+INDEX\s+"
              r"ux_verificaciones_incidencia"
              r"\s+ON\s+public\.verificaciones"
              r"\s*\(\s*incidencia_id\s*\)"
          )

          assert re.search(
              indice_unico,
              contenido,
              flags=re.IGNORECASE,
          ), "Falta el indice unico de verificaciones."

          # Verificar la proteccion de asignaciones activas.
          assert (
              "ux_asignacion_activa_por_incidencia"
              in contenido
          ), "Falta el indice de asignaciones activas."

          print("Sintaxis SQL: OK")
          print("Ocho tablas del MVP: OK")
          print("RLS habilitado en las ocho tablas: OK")
          print("Indice unico de verificaciones: OK")
          print("Indice de asignaciones activas: OK")
          print(
              f"Instrucciones SQL analizadas: "
              f"{len(instrucciones)}"
          )
          PY


          
      - name: Probar esquema en PostgreSQL temporal
        shell: bash
        run: |
          set -euo pipefail

          # Crear una base PostgreSQL solo para esta prueba.
          docker run --detach --rm \
            --name grocio-pg-mvp-test \
            -e POSTGRES_PASSWORD=clave_solo_para_ci \
            -e POSTGRES_DB=grocio_test \
            -v "$GITHUB_WORKSPACE/database/01_esquema_mvp.sql:/tmp/esquema.sql:ro" \
            postgres:16

          # Eliminar el contenedor al finalizar.
          trap 'docker rm -f grocio-pg-mvp-test >/dev/null 2>&1 || true' EXIT

          # Esperar a que PostgreSQL este disponible.
          for intento in {1..30}; do
            if docker exec grocio-pg-mvp-test \
                pg_isready -U postgres -d grocio_test \
                >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          
          # Simular solo las dependencias minimas de Supabase.
          docker exec -i grocio-pg-mvp-test \
            psql -U postgres -d grocio_test \
            -v ON_ERROR_STOP=1 <<'SQL'

          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
              id UUID PRIMARY KEY
          );
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          SQL

          # Ejecutar nuestro esquema completo.
          docker exec grocio-pg-mvp-test \
            psql -U postgres -d grocio_test \
            -v ON_ERROR_STOP=1 \
            -f /tmp/esquema.sql

          # Comprobar que existen las ocho tablas.
          tablas=$(docker exec grocio-pg-mvp-test \
            psql -U postgres -d grocio_test -At \
            -c "SELECT count(*) FROM pg_tables WHERE schemaname = 'public';")

          test "$tablas" = "8"
          echo "Ocho tablas creadas: OK"

          # Comprobar que todas tienen RLS activado.
          rls=$(docker exec grocio-pg-mvp-test \
            psql -U postgres -d grocio_test -At \
            -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relrowsecurity = true;")

          test "$rls" = "8"
          echo "RLS habilitado en ocho tablas: OK"

          # Comprobar ambos indices unicos.
          indices=$(docker exec grocio-pg-mvp-test \
            psql -U postgres -d grocio_test -At \
            -c "SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid WHERE i.indisunique = true AND c.relname IN ('ux_verificaciones_incidencia', 'ux_asignacion_activa_por_incidencia');")

          test "$indices" = "2"
          echo "Indices unicos creados: OK"

          echo "Prueba inicial de PostgreSQL completada."

          
          # Probar restricciones con datos reales.
          docker exec -i grocio-pg-mvp-test \
            psql -U postgres -d grocio_test \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          DECLARE
              v_area UUID := gen_random_uuid();
              v_jefe UUID := gen_random_uuid();
              v_representante UUID := gen_random_uuid();
              v_ticket UUID := gen_random_uuid();
              v_otro_ticket UUID := gen_random_uuid();
              v_restriccion TEXT;
          BEGIN
              INSERT INTO public.areas (id, nombre)
              VALUES (v_area, 'Area de prueba CI');

              INSERT INTO auth.users (id)
              VALUES (v_jefe), (v_representante);

              INSERT INTO public.usuarios (
                  id, area_id, nombre_completo, usuario, rol
              )
              VALUES
                  (
                      v_jefe, v_area, 'Jefe de prueba',
                      'jefe_ci', 'JEFE'
                  ),
                  (
                      v_representante, v_area,
                      'Representante de prueba',
                      'representante_ci', 'REPRESENTANTE'
                  );

              INSERT INTO public.incidencias (
                  id, area_id, reportante_id,
                  asunto, descripcion, estado,
                  fecha_cierre, cerrado_por_usuario_id
              )
              VALUES
                  (
                      v_ticket, v_area, v_representante,
                      'Falla de impresora', 'No imprime',
                      'Cerrado', now(), v_jefe
                  ),
                  (
                      v_otro_ticket, v_area, v_representante,
                      'Falla de red', 'Sin conexion',
                      'Cerrado', now(), v_jefe
                  );

              -- Primera evaluacion: permitida.
              INSERT INTO public.verificaciones (
                  incidencia_id, usuario_id,
                  resultado, observaciones
              )
              VALUES (
                  v_ticket, v_representante,
                  'Conformidad', 'Atencion correcta'
              );

              -- Segunda evaluacion del mismo ticket:
              -- PostgreSQL debe rechazarla.
              BEGIN
                  INSERT INTO public.verificaciones (
                      incidencia_id, usuario_id,
                      resultado, observaciones
                  )
                  VALUES (
                      v_ticket, v_representante,
                      'Observación', 'Persisten las fallas'
                  );

                  RAISE EXCEPTION
                      'Fallo: se permitio una evaluacion duplicada';

              EXCEPTION WHEN unique_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'ux_verificaciones_incidencia' THEN
                      RAISE EXCEPTION
                          'Restriccion inesperada: %',
                          v_restriccion;
                  END IF;
              END;

              -- Otro ticket si puede tener su evaluacion.
              INSERT INTO public.verificaciones (
                  incidencia_id, usuario_id,
                  resultado, observaciones
              )
              VALUES (
                  v_otro_ticket, v_representante,
                  'Conformidad', 'Conexion restaurada'
              );

              IF (
                  SELECT count(*)
                  FROM public.verificaciones
                  WHERE incidencia_id = v_ticket
              ) <> 1 THEN
                  RAISE EXCEPTION
                      'Fallo: el ticket tiene evaluaciones duplicadas';
              END IF;

              RAISE NOTICE
                  'Restriccion de evaluaciones duplicadas: OK';
          END;
          $$;

          SQL

          echo "Prueba real de evaluaciones duplicadas: OK"

          
          # Probar el maximo de dos representantes por area.
          docker exec -i grocio-pg-mvp-test \
            psql -U postgres -d grocio_test \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          DECLARE
              v_area UUID := gen_random_uuid();
              v_rep1 UUID := gen_random_uuid();
              v_rep2 UUID := gen_random_uuid();
              v_rep3 UUID := gen_random_uuid();
              v_rechazado BOOLEAN := FALSE;
              v_mensaje TEXT;
          BEGIN
              INSERT INTO public.areas (id, nombre)
              VALUES (v_area, 'Area de cupos CI');

              INSERT INTO auth.users (id)
              VALUES (v_rep1), (v_rep2), (v_rep3);

              -- Registrar dos representantes habilitados.
              INSERT INTO public.usuarios (
                  id, area_id, nombre_completo,
                  usuario, rol, habilitado
              )
              VALUES
                  (
                      v_rep1, v_area, 'Representante uno',
                      'rep1_ci', 'REPRESENTANTE', TRUE
                  ),
                  (
                      v_rep2, v_area, 'Representante dos',
                      'rep2_ci', 'REPRESENTANTE', TRUE
                  );

              -- Un tercer representante activo debe fallar.
              BEGIN
                  INSERT INTO public.usuarios (
                      id, area_id, nombre_completo,
                      usuario, rol, habilitado
                  )
                  VALUES (
                      v_rep3, v_area, 'Representante tres',
                      'rep3_ci', 'REPRESENTANTE', TRUE
                  );

              EXCEPTION WHEN raise_exception THEN
                  GET STACKED DIAGNOSTICS
                      v_mensaje = MESSAGE_TEXT;

                  IF v_mensaje <>
                     'El area ya tiene dos representantes habilitados'
                  THEN
                      RAISE;
                  END IF;

                  v_rechazado := TRUE;
              END;

              IF NOT v_rechazado THEN
                  RAISE EXCEPTION
                      'Fallo: se permitieron tres representantes';
              END IF;

              -- El tercero puede existir deshabilitado.
              INSERT INTO public.usuarios (
                  id, area_id, nombre_completo,
                  usuario, rol, habilitado
              )
              VALUES (
                  v_rep3, v_area, 'Representante tres',
                  'rep3_ci', 'REPRESENTANTE', FALSE
              );

              -- Tampoco se debe permitir activarlo.
              v_rechazado := FALSE;

              BEGIN
                  UPDATE public.usuarios
                  SET habilitado = TRUE
                  WHERE id = v_rep3;

              EXCEPTION WHEN raise_exception THEN
                  GET STACKED DIAGNOSTICS
                      v_mensaje = MESSAGE_TEXT;

                  IF v_mensaje <>
                     'El area ya tiene dos representantes habilitados'
                  THEN
                      RAISE;
                  END IF;

                  v_rechazado := TRUE;
              END;

              IF NOT v_rechazado THEN
                  RAISE EXCEPTION
                      'Fallo: se activo un tercer representante';
              END IF;

              -- Liberar un cupo deshabilitando al primero.
              UPDATE public.usuarios
              SET habilitado = FALSE
              WHERE id = v_rep1;

              -- Ahora el tercero puede habilitarse.
              UPDATE public.usuarios
              SET habilitado = TRUE
              WHERE id = v_rep3;

              IF (
                  SELECT count(*)
                  FROM public.usuarios
                  WHERE area_id = v_area
                    AND rol = 'REPRESENTANTE'
                    AND habilitado = TRUE
              ) <> 2 THEN
                  RAISE EXCEPTION
                      'Fallo: cantidad incorrecta de representantes';
              END IF;

              RAISE NOTICE
                  'Limite de dos representantes por area: OK';
          END;
          $$;

          SQL

          echo "Prueba real de cupos de representantes: OK"

          
          # Probar una sola asignacion activa por incidencia.
          docker exec -i grocio-pg-mvp-test \
            psql -U postgres -d grocio_test \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          DECLARE
              v_area UUID := gen_random_uuid();
              v_jefe UUID := gen_random_uuid();
              v_rep UUID := gen_random_uuid();
              v_tec1 UUID := gen_random_uuid();
              v_tec2 UUID := gen_random_uuid();
              v_ticket UUID := gen_random_uuid();
              v_asignacion UUID := gen_random_uuid();
              v_restriccion TEXT;
              v_rechazado BOOLEAN := FALSE;
          BEGIN
              INSERT INTO public.areas (id, nombre)
              VALUES (v_area, 'Area de asignaciones CI');

              INSERT INTO auth.users (id)
              VALUES
                  (v_jefe), (v_rep),
                  (v_tec1), (v_tec2);

              INSERT INTO public.usuarios (
                  id, area_id, nombre_completo,
                  usuario, rol
              )
              VALUES
                  (
                      v_jefe, v_area, 'Jefe CI',
                      'jefe_asig_ci', 'JEFE'
                  ),
                  (
                      v_rep, v_area, 'Reportante CI',
                      'rep_asig_ci', 'REPRESENTANTE'
                  ),
                  (
                      v_tec1, v_area, 'Practicante CI',
                      'prac_asig_ci', 'PRACTICANTE'
                  ),
                  (
                      v_tec2, v_area, 'Asistente CI',
                      'asis_asig_ci', 'ASISTENTE'
                  );

              INSERT INTO public.incidencias (
                  id, area_id, reportante_id,
                  asunto, descripcion
              )
              VALUES (
                  v_ticket, v_area, v_rep,
                  'Problema de red',
                  'No existe conexion a internet'
              );

              -- Primera asignacion activa: permitida.
              INSERT INTO public.asignaciones (
                  id, incidencia_id, tecnico_id,
                  asignado_por_id, origen_asignacion
              )
              VALUES (
                  v_asignacion, v_ticket, v_tec1,
                  v_jefe, 'JEFATURA'
              );

              -- Segundo tecnico activo: rechazado.
              BEGIN
                  INSERT INTO public.asignaciones (
                      incidencia_id, tecnico_id,
                      asignado_por_id, origen_asignacion
                  )
                  VALUES (
                      v_ticket, v_tec2,
                      v_jefe, 'JEFATURA'
                  );

              EXCEPTION WHEN unique_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'ux_asignacion_activa_por_incidencia'
                  THEN
                      RAISE;
                  END IF;

                  v_rechazado := TRUE;
              END;

              IF NOT v_rechazado THEN
                  RAISE EXCEPTION
                      'Fallo: dos tecnicos activos permitidos';
              END IF;

              -- Finalizar asignacion anterior.
              UPDATE public.asignaciones
              SET fecha_fin = now(),
                  motivo_reasignacion =
                      'Reasignacion por jefatura'
              WHERE id = v_asignacion;

              -- Nueva asignacion: ahora permitida.
              INSERT INTO public.asignaciones (
                  incidencia_id, tecnico_id,
                  asignado_por_id, origen_asignacion
              )
              VALUES (
                  v_ticket, v_tec2,
                  v_jefe, 'JEFATURA'
              );

              -- Deben existir dos registros historicos.
              IF (
                  SELECT count(*)
                  FROM public.asignaciones
                  WHERE incidencia_id = v_ticket
              ) <> 2 THEN
                  RAISE EXCEPTION
                      'Fallo: historial de asignaciones incorrecto';
              END IF;

              -- Solo el asistente debe seguir activo.
              IF (
                  SELECT count(*)
                  FROM public.asignaciones
                  WHERE incidencia_id = v_ticket
                    AND fecha_fin IS NULL
                    AND tecnico_id = v_tec2
              ) <> 1 THEN
                  RAISE EXCEPTION
                      'Fallo: responsable activo incorrecto';
              END IF;

              IF (
                  SELECT count(*)
                  FROM public.asignaciones
                  WHERE incidencia_id = v_ticket
                    AND fecha_fin IS NULL
              ) <> 1 THEN
                  RAISE EXCEPTION
                      'Fallo: cantidad incorrecta de responsables';
              END IF;

              RAISE NOTICE
                  'Asignacion unica y reasignacion: OK';
          END;
          $$;

          SQL

          echo "Prueba real de asignaciones tecnicas: OK"

          
          # Probar la integridad del cierre de incidencias.
          docker exec -i grocio-pg-mvp-test \
            psql -U postgres -d grocio_test \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          DECLARE
              v_area UUID := gen_random_uuid();
              v_jefe UUID := gen_random_uuid();
              v_rep UUID := gen_random_uuid();
              v_ticket UUID := gen_random_uuid();
              v_restriccion TEXT;
              v_rechazado BOOLEAN;
          BEGIN
              INSERT INTO public.areas (id, nombre)
              VALUES (v_area, 'Area de cierres CI');

              INSERT INTO auth.users (id)
              VALUES (v_jefe), (v_rep);

              INSERT INTO public.usuarios (
                  id, area_id, nombre_completo,
                  usuario, rol
              )
              VALUES
                  (
                      v_jefe, v_area, 'Jefe de prueba',
                      'jefe_cierre_ci', 'JEFE'
                  ),
                  (
                      v_rep, v_area, 'Reportante de prueba',
                      'rep_cierre_ci', 'REPRESENTANTE'
                  );

              INSERT INTO public.incidencias (
                  id, area_id, reportante_id,
                  asunto, descripcion
              )
              VALUES (
                  v_ticket, v_area, v_rep,
                  'Falla de impresora',
                  'La impresora no responde'
              );

              -- Cierre sin fecha ni responsable:
              -- PostgreSQL debe rechazarlo.
              v_rechazado := FALSE;

              BEGIN
                  UPDATE public.incidencias
                  SET estado = 'Cerrado'
                  WHERE id = v_ticket;

              EXCEPTION WHEN check_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_cierre_consistente'
                  THEN
                      RAISE;
                  END IF;

                  v_rechazado := TRUE;
              END;

              IF NOT v_rechazado THEN
                  RAISE EXCEPTION
                      'Fallo: se permitio un cierre incompleto';
              END IF;

              -- No se permiten datos de cierre
              -- mientras el ticket sigue pendiente.
              v_rechazado := FALSE;

              BEGIN
                  UPDATE public.incidencias
                  SET fecha_cierre = now(),
                      cerrado_por_usuario_id = v_jefe
                  WHERE id = v_ticket;

              EXCEPTION WHEN check_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_cierre_consistente'
                  THEN
                      RAISE;
                  END IF;

                  v_rechazado := TRUE;
              END;

              IF NOT v_rechazado THEN
                  RAISE EXCEPTION
                      'Fallo: ticket pendiente con datos de cierre';
              END IF;

              -- Cierre completo: permitido.
              UPDATE public.incidencias
              SET estado = 'Cerrado',
                  fecha_cierre = now(),
                  cerrado_por_usuario_id = v_jefe
              WHERE id = v_ticket;

              IF NOT EXISTS (
                  SELECT 1
                  FROM public.incidencias
                  WHERE id = v_ticket
                    AND estado = 'Cerrado'
                    AND fecha_cierre IS NOT NULL
                    AND cerrado_por_usuario_id = v_jefe
              ) THEN
                  RAISE EXCEPTION
                      'Fallo: cierre completo incorrecto';
              END IF;

              RAISE NOTICE
                  'Integridad del cierre de incidencias: OK';
          END;
          $$;

          SQL

          echo "Prueba real de cierre de incidencias: OK"


          
          # Probar relaciones entre incidencias, areas y usuarios.
          docker exec -i grocio-pg-mvp-test \
            psql -U postgres -d grocio_test \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          DECLARE
              v_area UUID := gen_random_uuid();
              v_representante UUID := gen_random_uuid();
              v_ticket UUID := gen_random_uuid();
              v_inexistente UUID := gen_random_uuid();
              v_restriccion TEXT;
              v_rechazado BOOLEAN;
          BEGIN
              -- Crear area y representante validos.
              INSERT INTO public.areas (id, nombre)
              VALUES (v_area, 'Area de relaciones CI');

              INSERT INTO auth.users (id)
              VALUES (v_representante);

              INSERT INTO public.usuarios (
                  id, area_id, nombre_completo,
                  usuario, rol
              )
              VALUES (
                  v_representante, v_area,
                  'Representante de relaciones',
                  'rep_relaciones_ci', 'REPRESENTANTE'
              );

              -- Rechazar un area inexistente.
              v_rechazado := FALSE;

              BEGIN
                  INSERT INTO public.incidencias (
                      area_id, reportante_id,
                      asunto, descripcion
                  )
                  VALUES (
                      v_inexistente, v_representante,
                      'Prueba area inexistente',
                      'No debe registrarse'
                  );

              EXCEPTION WHEN foreign_key_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_area_id_fkey' THEN
                      RAISE;
                  END IF;

                  v_rechazado := TRUE;
              END;

              IF NOT v_rechazado THEN
                  RAISE EXCEPTION
                      'Fallo: se acepto un area inexistente';
              END IF;

              -- Rechazar un reportante inexistente.
              v_rechazado := FALSE;

              BEGIN
                  INSERT INTO public.incidencias (
                      area_id, reportante_id,
                      asunto, descripcion
                  )
                  VALUES (
                      v_area, v_inexistente,
                      'Prueba reportante inexistente',
                      'No debe registrarse'
                  );

              EXCEPTION WHEN foreign_key_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_reportante_id_fkey' THEN
                      RAISE;
                  END IF;

                  v_rechazado := TRUE;
              END;

              IF NOT v_rechazado THEN
                  RAISE EXCEPTION
                      'Fallo: se acepto un usuario inexistente';
              END IF;

              -- Una incidencia valida debe registrarse.
              INSERT INTO public.incidencias (
                  id, area_id, reportante_id,
                  asunto, descripcion
              )
              VALUES (
                  v_ticket, v_area, v_representante,
                  'Falla de computadora',
                  'El equipo no enciende'
              );

              -- Verificar relaciones y codigo automatico.
              IF NOT EXISTS (
                  SELECT 1
                  FROM public.incidencias
                  WHERE id = v_ticket
                    AND area_id = v_area
                    AND reportante_id = v_representante
                    AND codigo IS NOT NULL
              ) THEN
                  RAISE EXCEPTION
                      'Fallo: incidencia valida incorrecta';
              END IF;

              -- Rechazar una incidencia anterior inexistente.
              v_rechazado := FALSE;

              BEGIN
                  INSERT INTO public.incidencias (
                      area_id, reportante_id,
                      asunto, descripcion,
                      incidencia_anterior_id
                  )
                  VALUES (
                      v_area, v_representante,
                      'Prueba reincidencia invalida',
                      'Referencia inexistente',
                      v_inexistente
                  );

              EXCEPTION WHEN foreign_key_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_incidencia_anterior_id_fkey'
                  THEN
                      RAISE;
                  END IF;

                  v_rechazado := TRUE;
              END;

              IF NOT v_rechazado THEN
                  RAISE EXCEPTION
                      'Fallo: reincidencia inexistente aceptada';
              END IF;

              RAISE NOTICE
                  'Relaciones de incidencias y usuarios: OK';
          END;
          $$;

          SQL

          echo "Prueba real de relaciones y claves foraneas: OK"


          
          # Probar que el reportante pertenezca a su area.
          docker exec -i grocio-pg-mvp-test \
            psql -U postgres -d grocio_test \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          DECLARE
              v_tesoreria UUID := gen_random_uuid();
              v_contabilidad UUID := gen_random_uuid();
              v_representante UUID := gen_random_uuid();
              v_deshabilitado UUID := gen_random_uuid();
              v_asistente UUID := gen_random_uuid();
              v_ticket UUID := gen_random_uuid();
              v_restriccion TEXT;
          BEGIN
              -- Preparar dos areas diferentes.
              INSERT INTO public.areas (id, nombre)
              VALUES
                  (v_tesoreria, 'Tesoreria pertenencia CI'),
                  (v_contabilidad, 'Contabilidad pertenencia CI');

              INSERT INTO auth.users (id)
              VALUES
                  (v_representante),
                  (v_deshabilitado),
                  (v_asistente);

              INSERT INTO public.usuarios (
                  id, area_id, nombre_completo,
                  usuario, rol, habilitado
              )
              VALUES
                  (
                      v_representante, v_tesoreria,
                      'Representante Tesoreria',
                      'rep_pertenencia_ci',
                      'REPRESENTANTE', TRUE
                  ),
                  (
                      v_deshabilitado, v_tesoreria,
                      'Representante inactivo',
                      'rep_inactivo_ci',
                      'REPRESENTANTE', FALSE
                  ),
                  (
                      v_asistente, v_tesoreria,
                      'Asistente de Sistemas',
                      'asistente_pertenencia_ci',
                      'ASISTENTE', TRUE
                  );

              -- Caso 1: representante y area correctos.
              INSERT INTO public.incidencias (
                  id, area_id, reportante_id,
                  asunto, descripcion
              )
              VALUES (
                  v_ticket, v_tesoreria, v_representante,
                  'Impresora de Tesoreria',
                  'El equipo no responde'
              );

              -- Caso 2: representante de otra area.
              BEGIN
                  INSERT INTO public.incidencias (
                      area_id, reportante_id,
                      asunto, descripcion
                  )
                  VALUES (
                      v_contabilidad, v_representante,
                      'Incidencia de otra area',
                      'Debe ser rechazada'
                  );

                  RAISE EXCEPTION
                      'Fallo: incidencia entre areas permitida';

              EXCEPTION WHEN check_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_reportante_area_valida'
                  THEN
                      RAISE;
                  END IF;
              END;

              -- Caso 3: representante deshabilitado.
              BEGIN
                  INSERT INTO public.incidencias (
                      area_id, reportante_id,
                      asunto, descripcion
                  )
                  VALUES (
                      v_tesoreria, v_deshabilitado,
                      'Incidencia de usuario inactivo',
                      'Debe ser rechazada'
                  );

                  RAISE EXCEPTION
                      'Fallo: representante inactivo permitido';

              EXCEPTION WHEN check_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_reportante_area_valida'
                  THEN
                      RAISE;
                  END IF;
              END;

              -- Caso 4: un asistente no es reportante.
              BEGIN
                  INSERT INTO public.incidencias (
                      area_id, reportante_id,
                      asunto, descripcion
                  )
                  VALUES (
                      v_tesoreria, v_asistente,
                      'Incidencia registrada por asistente',
                      'Debe ser rechazada'
                  );

                  RAISE EXCEPTION
                      'Fallo: rol asistente permitido';

              EXCEPTION WHEN check_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_reportante_area_valida'
                  THEN
                      RAISE;
                  END IF;
              END;

              -- Caso 5: impedir cambiar el area
              -- de una incidencia ya registrada.
              BEGIN
                  UPDATE public.incidencias
                  SET area_id = v_contabilidad
                  WHERE id = v_ticket;

                  RAISE EXCEPTION
                      'Fallo: cambio de area indebido';

              EXCEPTION WHEN check_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_reportante_area_valida'
                  THEN
                      RAISE;
                  END IF;
              END;

              -- El ticket original debe permanecer intacto.
              IF NOT EXISTS (
                  SELECT 1
                  FROM public.incidencias
                  WHERE id = v_ticket
                    AND area_id = v_tesoreria
                    AND reportante_id = v_representante
              ) THEN
                  RAISE EXCEPTION
                      'Fallo: se modifico la incidencia valida';
              END IF;

              RAISE NOTICE
                  'Pertenencia del reportante al area: OK';
          END;
          $$;

          SQL

          echo "Prueba real de pertenencia del reportante: OK"

          
          # Probar traslado de area y deshabilitacion.
          docker exec -i grocio-pg-mvp-test \
            psql -U postgres -d grocio_test \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          DECLARE
              v_area_origen UUID := gen_random_uuid();
              v_area_destino UUID := gen_random_uuid();
              v_representante UUID := gen_random_uuid();
              v_ticket_anterior UUID := gen_random_uuid();
              v_ticket_nuevo UUID := gen_random_uuid();
              v_restriccion TEXT;
              v_rechazado BOOLEAN;
          BEGIN
              -- Crear dos areas municipales.
              INSERT INTO public.areas (id, nombre)
              VALUES
                  (v_area_origen, 'Tesoreria traslado CI'),
                  (v_area_destino, 'Contabilidad traslado CI');

              INSERT INTO auth.users (id)
              VALUES (v_representante);

              INSERT INTO public.usuarios (
                  id, area_id, nombre_completo,
                  usuario, rol, habilitado
              )
              VALUES (
                  v_representante, v_area_origen,
                  'Representante trasladado',
                  'rep_traslado_ci',
                  'REPRESENTANTE', TRUE
              );

              -- Registrar un ticket en el area original.
              INSERT INTO public.incidencias (
                  id, area_id, reportante_id,
                  asunto, descripcion
              )
              VALUES (
                  v_ticket_anterior,
                  v_area_origen,
                  v_representante,
                  'Impresora de Tesoreria',
                  'La impresora no funciona'
              );

              -- Trasladar al representante a Contabilidad.
              UPDATE public.usuarios
              SET area_id = v_area_destino
              WHERE id = v_representante;

              -- El ticket anterior conserva su area.
              IF NOT EXISTS (
                  SELECT 1
                  FROM public.incidencias
                  WHERE id = v_ticket_anterior
                    AND area_id = v_area_origen
                    AND reportante_id = v_representante
              ) THEN
                  RAISE EXCEPTION
                      'Fallo: se altero el ticket historico';
              END IF;

              -- No puede registrar nuevos tickets
              -- para su antigua area.
              v_rechazado := FALSE;

              BEGIN
                  INSERT INTO public.incidencias (
                      area_id, reportante_id,
                      asunto, descripcion
                  )
                  VALUES (
                      v_area_origen, v_representante,
                      'Nuevo ticket en Tesoreria',
                      'Registro que debe rechazarse'
                  );

              EXCEPTION WHEN check_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_reportante_area_valida'
                  THEN
                      RAISE;
                  END IF;

                  v_rechazado := TRUE;
              END;

              IF NOT v_rechazado THEN
                  RAISE EXCEPTION
                      'Fallo: se permitio registrar en el area anterior';
              END IF;

              -- Si puede registrar en su nueva area.
              INSERT INTO public.incidencias (
                  id, area_id, reportante_id,
                  asunto, descripcion
              )
              VALUES (
                  v_ticket_nuevo,
                  v_area_destino,
                  v_representante,
                  'Problema de red en Contabilidad',
                  'No hay conexion'
              );

              -- Deshabilitar al representante.
              UPDATE public.usuarios
              SET habilitado = FALSE
              WHERE id = v_representante;

              -- Un deshabilitado no puede crear tickets.
              v_rechazado := FALSE;

              BEGIN
                  INSERT INTO public.incidencias (
                      area_id, reportante_id,
                      asunto, descripcion
                  )
                  VALUES (
                      v_area_destino, v_representante,
                      'Nuevo ticket de usuario inactivo',
                      'Registro que debe rechazarse'
                  );

              EXCEPTION WHEN check_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_restriccion = CONSTRAINT_NAME;

                  IF v_restriccion <>
                     'incidencias_reportante_area_valida'
                  THEN
                      RAISE;
                  END IF;

                  v_rechazado := TRUE;
              END;

              IF NOT v_rechazado THEN
                  RAISE EXCEPTION
                      'Fallo: usuario deshabilitado pudo registrar';
              END IF;

              -- Los registros anteriores permanecen intactos.
              IF (
                  SELECT count(*)
                  FROM public.incidencias
                  WHERE reportante_id = v_representante
              ) <> 2 THEN
                  RAISE EXCEPTION
                      'Fallo: se alteraron incidencias historicas';
              END IF;

              RAISE NOTICE
                  'Traslado y deshabilitacion de representante: OK';
          END;
          $$;

          SQL

          echo "Prueba real de traslado y deshabilitacion: OK"

          
          # Verificar seguridad de acceso a las ocho tablas.
          docker exec -i grocio-pg-mvp-test \
            psql -U postgres -d grocio_test \
            -v ON_ERROR_STOP=1 <<'SQL'

          DO $$
          DECLARE
              v_tabla TEXT;
              v_rol TEXT;
              v_permiso TEXT;
              v_rls BOOLEAN;
          BEGIN
              FOREACH v_tabla IN ARRAY ARRAY[
                  'areas',
                  'usuarios',
                  'incidencias',
                  'asignaciones',
                  'intervenciones',
                  'verificaciones',
                  'evidencias',
                  'historial_incidencias'
              ]
              LOOP
                  -- Comprobar que RLS esta habilitado.
                  SELECT c.relrowsecurity
                  INTO v_rls
                  FROM pg_class c
                  JOIN pg_namespace n
                    ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public'
                    AND c.relname = v_tabla
                    AND c.relkind = 'r';

                  IF v_rls IS DISTINCT FROM TRUE THEN
                      RAISE EXCEPTION
                          'RLS no habilitado en: %',
                          v_tabla;
                  END IF;

                  -- Los roles de cliente no deben
                  -- disponer de permisos directos.
                  FOREACH v_rol IN ARRAY ARRAY[
                      'anon',
                      'authenticated'
                  ]
                  LOOP
                      FOREACH v_permiso IN ARRAY ARRAY[
                          'SELECT',
                          'INSERT',
                          'UPDATE',
                          'DELETE'
                      ]
                      LOOP
                          IF has_table_privilege(
                              v_rol,
                              format('public.%I', v_tabla),
                              v_permiso
                          ) THEN
                              RAISE EXCEPTION
                                  'Acceso no autorizado: % / % / %',
                                  v_rol, v_tabla, v_permiso;
                          END IF;
                      END LOOP;
                  END LOOP;
              END LOOP;

              RAISE NOTICE
                  'Proteccion de ocho tablas y permisos: OK';
          END;
          $$;

          SQL

          # Comprobar rechazo de lecturas como usuario anonimo
          # y como usuario autenticado sin permisos directos.
          for rol in anon authenticated; do
            if docker exec grocio-pg-mvp-test \
                psql -U postgres -d grocio_test \
                -v ON_ERROR_STOP=1 \
                -c "SET ROLE ${rol}; SELECT id FROM public.incidencias LIMIT 1;" \
                >/dev/null 2>&1; then
              echo "ERROR: el rol ${rol} pudo consultar incidencias"
              exit 1
            fi
          done

          echo "Prueba real de acceso restringido: OK"



