name: 110E - Pruebas integrales por perfiles

on:
  push:
    branches:
      - ajustes-docente-v4
    paths:
      - "backend/**"
      - "frontend/**"
      - "database/**"
      - ".github/scripts/flujo_integral_110e.py"
      - ".github/workflows/pruebas-integrales-110e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flujo-integral:
    name: Flujo V3-V4 con roles en PostgreSQL temporal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "httpx>=0.28,<1"

      - name: Ejecutar flujo completo de representantes y soporte TI
        shell: bash
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          contenedor="grocio-integral-110e-ci"
          docker run -d --rm \
            --name "$contenedor" \
            -p 127.0.0.1::5432 \
            -e POSTGRES_DB=grocio_ci \
            -e POSTGRES_PASSWORD=clave_ci_temporal \
            -v "$GITHUB_WORKSPACE/database:/sql:ro" \
            postgres:16 >/dev/null
          trap 'docker rm -f "$contenedor" >/dev/null 2>&1 || true' EXIT

          listo=0
          for intento in {1..45}; do
            if docker exec -e PGPASSWORD=clave_ci_temporal "$contenedor" \
              psql -X -h 127.0.0.1 -U postgres -d grocio_ci \
              -Atq -c 'SELECT 1' >/dev/null 2>&1; then
              listo=1
              break
            fi
            sleep 1
          done
          test "$listo" -eq 1 || {
            echo 'ERROR: PostgreSQL temporal no inicializo correctamente'
            exit 1
          }

          docker exec -i "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id UUID PRIMARY KEY);
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE soporte_ti_api LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT
            PASSWORD 'api_ci_temporal';
          SQL

          docker exec "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/01_esquema_mvp.sql
          docker exec "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/02_permisos_backend.sql
          docker exec "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/03_reapertura_v4.sql

          # Perfiles ficticios, no cuentas autenticas ni datos de Supabase.
          docker exec -i "$contenedor" psql -X -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.areas(id, nombre) VALUES
            ('11111111-1111-4111-8111-111111111111', 'Tesoreria CI'),
            ('99999999-9999-4999-8999-999999999999', 'Otra area CI');
          INSERT INTO auth.users(id) VALUES
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333'),
            ('44444444-4444-4444-8444-444444444444'),
            ('55555555-5555-4555-8555-555555555555'),
            ('77777777-7777-4777-8777-777777777777');
          INSERT INTO public.usuarios
            (id, area_id, nombre_completo, usuario, rol, habilitado)
          VALUES
            ('22222222-2222-4222-8222-222222222222',
             '11111111-1111-4111-8111-111111111111',
             'Representante CI', 'rep_110e_ci', 'REPRESENTANTE', true),
            ('33333333-3333-4333-8333-333333333333',
             '11111111-1111-4111-8111-111111111111',
             'Jefe CI', 'jefe_110e_ci', 'JEFE', true),
            ('44444444-4444-4444-8444-444444444444',
             '11111111-1111-4111-8111-111111111111',
             'Asistente CI', 'asistente_110e_ci', 'ASISTENTE', true),
            ('55555555-5555-4555-8555-555555555555',
             '11111111-1111-4111-8111-111111111111',
             'Practicante CI', 'practicante_110e_ci', 'PRACTICANTE', true),
            ('77777777-7777-4777-8777-777777777777',
             '99999999-9999-4999-8999-999999999999',
             'Representante externo CI', 'rep_externo_110e_ci', 'REPRESENTANTE', true);
          SQL

          publicado="$(docker port "$contenedor" 5432/tcp)"
          export CI_PG_PORT="${publicado##*:}"
          test "$CI_PG_PORT" -gt 0
          python .github/scripts/flujo_integral_110e.py

  compilar-frontend:
    name: Compilar interfaz React de todos los perfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Compilar interfaz
        working-directory: frontend
        run: npm run build
      - name: Validar archivos de salida
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          echo 'OK: React compilado; los formularios reales conservan su compilacion'
