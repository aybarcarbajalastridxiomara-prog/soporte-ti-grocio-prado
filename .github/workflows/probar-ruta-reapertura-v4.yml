
name: Probar ruta de reapertura V4

on:
  push:
    branches:
      - ajustes-docente-v4
    paths:
      - "backend/app/routes/v4_verificaciones.py"
      - "backend/app/v4_esquema.py"
      - "backend/app/v4_reglas.py"
      - "database/03_reapertura_v4.sql"
      - ".github/workflows/probar-ruta-reapertura-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-ruta:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "httpx>=0.28,<1"

      - name: Paso 109D6 - Probar ruta FastAPI
        shell: bash
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail

          CONTENEDOR="grocio-reapertura-ci"

          docker run --detach --rm \
            --name "$CONTENEDOR" \
            -p 127.0.0.1:55435:5432 \
            -e POSTGRES_PASSWORD=clave_ci_temporal \
            -e POSTGRES_DB=grocio_ci \
            -v "$GITHUB_WORKSPACE/database:/sql:ro" \
            postgres:16 >/dev/null

          trap 'docker rm -f "$CONTENEDOR" >/dev/null 2>&1 || true' EXIT

          listo=0
          for intento in {1..30}; do
            if docker exec "$CONTENEDOR" \
              pg_isready -U postgres -d grocio_ci \
              >/dev/null 2>&1; then
              listo=1
              break
            fi
            sleep 2
          done

          test "$listo" -eq 1

          # Infraestructura ficticia de Supabase.
          docker exec -i "$CONTENEDOR" \
            psql -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id UUID PRIMARY KEY);
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE soporte_ti_api
            LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT
            PASSWORD 'api_ci_temporal';
          SQL

          docker exec "$CONTENEDOR" \
            psql -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/01_esquema_mvp.sql

          docker exec "$CONTENEDOR" \
            psql -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 -f /sql/02_permisos_backend.sql

          # Datos ficticios de dos areas y cuatro tickets.
          docker exec -i "$CONTENEDOR" \
            psql -U postgres -d grocio_ci \
            -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.areas(id, nombre) VALUES
            ('11111111-1111-4111-8111-111111111111', 'Area A CI'),
            ('99999999-9999-4999-8999-999999999999', 'Area B CI');

          INSERT INTO auth.users(id) VALUES
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333'),
            ('44444444-4444-4444-8444-444444444444');

          INSERT INTO public.usuarios(
            id, area_id, nombre_completo, usuario, rol
          ) VALUES
            ('22222222-2222-4222-8222-222222222222',
             '11111111-1111-4111-8111-111111111111',
             'Representante A', 'rep_a_ci', 'REPRESENTANTE'),
            ('33333333-3333-4333-8333-333333333333',
             '99999999-9999-4999-8999-999999999999',
             'Representante B', 'rep_b_ci', 'REPRESENTANTE'),
            ('44444444-4444-4444-8444-444444444444',
             '11111111-1111-4111-8111-111111111111',
             'Jefe CI', 'jefe_ci', 'JEFE');

          INSERT INTO public.incidencias(
            id, area_id, reportante_id, asunto,
            descripcion, estado, fecha_cierre,
            cerrado_por_usuario_id
          ) VALUES
            ('55555555-5555-4555-8555-555555555555',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Ticket observable', 'Falla ficticia',
             'Cerrado', now(),
             '44444444-4444-4444-8444-444444444444'),
            ('66666666-6666-4666-8666-666666666666',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Ticket conforme', 'Prueba ficticia',
             'Cerrado', now(),
             '44444444-4444-4444-8444-444444444444'),
            ('77777777-7777-4777-8777-777777777777',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Ticket pendiente', 'No cerrado',
             'Pendiente', NULL, NULL),
            ('88888888-8888-4888-8888-888888888888',
             '11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             'Ticket rollback', 'Prueba de error',
             'Cerrado', now(),
             '44444444-4444-4444-8444-444444444444');
          SQL

          python - <<'PY'
          import subprocess
          from types import SimpleNamespace
          from uuid import UUID

          from fastapi.testclient import TestClient
          from sqlalchemy import create_engine, text
          from sqlalchemy.orm import Session

          from app.main import app
          from app.auth import get_current_user
          from app.db import get_db

          AREA_A = UUID("11111111-1111-4111-8111-111111111111")
          AREA_B = UUID("99999999-9999-4999-8999-999999999999")
          REP_A = UUID("22222222-2222-4222-8222-222222222222")
          REP_B = UUID("33333333-3333-4333-8333-333333333333")
          JEFE = UUID("44444444-4444-4444-8444-444444444444")
          T_OBS = UUID("55555555-5555-4555-8555-555555555555")
          T_OK = UUID("66666666-6666-4666-8666-666666666666")
          T_PEND = UUID("77777777-7777-4777-8777-777777777777")
          T_ERROR = UUID("88888888-8888-4888-8888-888888888888")

          engine = create_engine(
              "postgresql+psycopg://"
              "soporte_ti_api:api_ci_temporal"
              "@127.0.0.1:55435/grocio_ci"
          )

          actual = {"id": REP_A, "area_id": AREA_A,
                    "rol": "REPRESENTANTE"}

          def usuario_ficticio():
              return SimpleNamespace(**actual)

          def sesion_temporal():
              with Session(engine) as db:
                  yield db

          app.dependency_overrides[get_current_user] = usuario_ficticio
          app.dependency_overrides[get_db] = sesion_temporal
          cliente = TestClient(app, raise_server_exceptions=False)

          def verificar(ticket, resultado, motivo=None):
              datos = {"resultado": resultado}
              if motivo is not None:
                  datos["observaciones"] = motivo
              return cliente.post(
                  f"/api/v4/incidencias/{ticket}/verificaciones",
                  json=datos,
              )

          def comprobar(respuesta, esperado, nombre):
              assert respuesta.status_code == esperado, (
                  f"{nombre}: esperaba {esperado}, "
                  f"obtuvo {respuesta.status_code}: "
                  f"{respuesta.text[:300]}"
              )
              print(f"OK: {nombre}")

          def admin(sql):
              subprocess.run(
                  [
                      "docker", "exec", "grocio-reapertura-ci",
                      "psql", "-U", "postgres", "-d", "grocio_ci",
                      "-v", "ON_ERROR_STOP=1", "-c", sql,
                  ],
                  check=True,
              )

          def fila(sql, **params):
              with engine.connect() as conexion:
                  return conexion.execute(
                      text(sql), params
                  ).mappings().one()

          try:
              # En V3, nunca debe intentar reabrir.
              comprobar(
                  verificar(T_OBS, "Observación", "Persiste falla"),
                  503,
                  "Base V3 protegida",
              )

              # Instalar V4 solamente en PostgreSQL CI.
              admin("SELECT 1")
              subprocess.run(
                  [
                      "docker", "exec", "grocio-reapertura-ci",
                      "psql", "-U", "postgres", "-d", "grocio_ci",
                      "-v", "ON_ERROR_STOP=1",
                      "-f", "/sql/03_reapertura_v4.sql",
                  ],
                  check=True,
              )

              # Observacion: abre nuevo ciclo.
              respuesta = verificar(
                  T_OBS, "Observación", "La falla persiste"
              )
              comprobar(respuesta, 201, "Reapertura registrada")
              datos = respuesta.json()
              assert datos["ciclo_evaluado"] == 1
              assert datos["ciclo_actual"] == 2
              assert datos["estado_actual"] == "En revisión"

              ticket = fila(
                  "SELECT estado, ciclo_actual, fecha_cierre, "
                  "cerrado_por_usuario_id FROM public.incidencias "
                  "WHERE id = :id",
                  id=T_OBS,
              )
              assert ticket["estado"] == "En revisión"
              assert ticket["ciclo_actual"] == 2
              assert ticket["fecha_cierre"] is None
              assert ticket["cerrado_por_usuario_id"] is None

              historial = fila(
                  "SELECT COUNT(*) AS total FROM "
                  "public.historial_incidencias "
                  "WHERE incidencia_id = :id "
                  "AND accion IN ('OBSERVACION', 'REAPERTURA')",
                  id=T_OBS,
              )
              assert historial["total"] == 2
              print("OK: estado, ciclo e historial conservados")

              comprobar(
                  verificar(T_OBS, "Observación", "De nuevo"),
                  409,
                  "No verificar ticket abierto",
              )

              # Conformidad: no altera el cierre.
              comprobar(
                  verificar(T_OK, "Conformidad"),
                  201,
                  "Conformidad registrada",
              )
              conforme = fila(
                  "SELECT estado, ciclo_actual, fecha_cierre "
                  "FROM public.incidencias WHERE id = :id",
                  id=T_OK,
              )
              assert conforme["estado"] == "Cerrado"
              assert conforme["ciclo_actual"] == 1
              assert conforme["fecha_cierre"] is not None

              comprobar(
                  verificar(T_OK, "Conformidad"),
                  409,
                  "Duplicado del mismo ciclo rechazado",
              )

              comprobar(
                  verificar(T_PEND, "Observación", "Motivo valido"),
                  409,
                  "Ticket pendiente no verificable",
              )

              comprobar(
                  verificar(T_ERROR, "Observación", "  "),
                  422,
                  "Observacion vacia rechazada",
              )

              # Control de acceso entre areas.
              actual.update(id=REP_B, area_id=AREA_B)
              comprobar(
                  verificar(T_ERROR, "Conformidad"),
                  404,
                  "Area ajena rechazada",
              )

              # Control de roles.
              actual.update(id=JEFE, area_id=AREA_A, rol="JEFE")
              comprobar(
                  verificar(T_ERROR, "Conformidad"),
                  403,
                  "Rol no autorizado rechazado",
              )

              # Simular un fallo durante la reapertura.
              actual.update(
                  id=REP_A, area_id=AREA_A, rol="REPRESENTANTE"
              )
              admin("""
                  CREATE FUNCTION public.error_ci_reapertura()
                  RETURNS trigger LANGUAGE plpgsql AS $$
                  BEGIN
                      IF NEW.accion = 'REAPERTURA' THEN
                          RAISE EXCEPTION 'FALLO_CI';
                      END IF;
                      RETURN NEW;
                  END;
                  $$;
                  CREATE TRIGGER trg_error_ci_reapertura
                  BEFORE INSERT ON public.historial_incidencias
                  FOR EACH ROW
                  EXECUTE FUNCTION public.error_ci_reapertura();
              """)

              comprobar(
                  verificar(T_ERROR, "Observación", "Error simulado"),
                  500,
                  "Fallo transaccional simulado",
              )

              revertido = fila(
                  "SELECT estado, ciclo_actual, "
                  "(SELECT COUNT(*) FROM public.verificaciones "
                  " WHERE incidencia_id = :id) AS evaluaciones "
                  "FROM public.incidencias WHERE id = :id",
                  id=T_ERROR,
              )
              assert revertido["estado"] == "Cerrado"
              assert revertido["ciclo_actual"] == 1
              assert revertido["evaluaciones"] == 0
              print("OK: rollback completo sin registros parciales")

              print("PASO 109D6: PRUEBAS FUNCIONALES APROBADAS")

          finally:
              app.dependency_overrides.clear()
              engine.dispose()
          PY
