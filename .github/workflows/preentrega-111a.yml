name: 111A - Dashboard real y administración segura

on:
  push:
    branches: [ajustes-docente-v4]
    paths: ["frontend/**", "backend/**", "database/**", ".github/scripts/probar_workflows_local.py", ".github/workflows/preentrega-111a.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: backend
      DATABASE_URL: ""
      SUPABASE_URL: ""
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt "httpx>=0.28,<1" "pglast>=6,<9"
      - run: python -m compileall -q backend/app
      - run: python -m unittest discover -s backend/tests -v
      - run: python .github/scripts/preentrega_110f.py
      - run: python .github/scripts/probar_workflows_local.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_MODO_REAL: "false"
      - run: npm run build
        working-directory: frontend
        env:
          VITE_MODO_REAL: "true"
          VITE_API_BASE_URL: https://backend.example.invalid
          VITE_SUPABASE_URL: https://auth.example.invalid
          VITE_SUPABASE_ANON_KEY: clave-publica-prueba-sin-acceso
          VITE_PERMITIR_ASIGNACION_REAL: "false"
          VITE_PERMITIR_ATENCION_REAL: "false"
          VITE_PERMITIR_VERIFICACION_REAL: "false"
          VITE_CONSULTA_CICLOS_V4: "false"
